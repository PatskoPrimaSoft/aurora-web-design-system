<aurora-article-layout title="Компоненты">
  <p>Angular UI-kit Aurora. Выберите компонент в меню слева.</p>
  <ul>
    <li>
      <a routerLink="/components/icon" [queryParams]="settings.queryParams()">Icon</a>
      — иконка.
    </li>
    <li>
      <a routerLink="/components/button" [queryParams]="settings.queryParams()">Button</a>
      — кнопка с подписью и иконками.
    </li>
    <li>
      <a routerLink="/components/fab" [queryParams]="settings.queryParams()">FAB</a>
      — главное действие области.
    </li>
    <li>
      <a routerLink="/components/checkbox" [queryParams]="settings.queryParams()">Checkbox</a>
      — независимый и частичный выбор.
    </li>
    <li>
      <a routerLink="/components/spinner" [queryParams]="settings.queryParams()">Spinner</a>
      — ожидание операции с неизвестным прогрессом.
    </li>
  </ul>
</aurora-article-layout>
