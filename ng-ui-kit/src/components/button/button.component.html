<span data-ds-button-content>
  @if (icon(); as leadingIcon) {
    <ds-icon [name]="leadingIcon" [size]="iconSize()"></ds-icon>
  }
  <span data-ds-button-label><ng-content></ng-content></span>
  @if (iconRight(); as trailingIcon) {
    <ds-icon [name]="trailingIcon" [size]="iconSize()"></ds-icon>
  }
</span>
@if (loading()) {
  <span data-ds-button-spinner aria-hidden="true"><span></span></span>
}
