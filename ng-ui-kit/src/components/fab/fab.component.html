<span data-ds-fab-content>
  <ds-icon [name]="icon()"></ds-icon>
  @if (extended()) {
    <span #text data-ds-fab-label>{{ label() }}</span>
  }
</span>
@if (loading()) {
  <span data-ds-fab-spinner aria-hidden="true">
    <ds-spinner label="Выполнение действия"
      [size]="size() === 'sm' ? 18 : 24"
      [style.width]="'100%'"
      [style.height]="'100%'"
      [style.color]="'inherit'"></ds-spinner>
  </span>
}
<span #tip
  popover="manual"
  role="tooltip"
  [id]="tooltipId"
  (pointerenter)="keepTip()"
  (pointerleave)="leaveTip($event)"
  >{{ label() }}</span
>
