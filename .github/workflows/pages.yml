name: GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Released version tag created by CI
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag (vX.Y.Z) to deploy again
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Select version tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Pages requires a stable version tag vX.Y.Z.'
            exit 1
          fi
          echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Validate tag against package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node tools/pages.mjs validate-tag "$RELEASE_TAG"

      - run: npm ci
      - run: npm run build:catalog

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare project subdirectory URLs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node tools/pages.mjs prepare "$BASE_PATH"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy version catalogue
        id: deployment
        uses: actions/deploy-pages@v4
