# CI дизайн-системы. Правила разработки и релиза — AGENTS.md.
#   PR в develop/master     -> npm run verify
#   push в develop          -> npm run verify
#   push в master (= релиз) -> guard «версия ещё не выпущена», verify, npm publish в GitHub Packages,
#                              тег v<version> и GitHub Release из раздела CHANGELOG
#   workflow_dispatch       -> то же, что push в выбранную ветку (ручной перезапуск на том же коммите)
# Версия — package.json (разрабатываемая, её переводит /aurora-release). Теги ставит только этот workflow.
# Секретов нет: публикация и чтение реестра под GITHUB_TOKEN.
name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  verify:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@primasoftllc'

      - uses: jdx/mise-action@v5

      - name: Package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Release guard, version must not be released (master only)
        # Гейт смотрит только на тег: он единственный признак завершённого релиза. Пакет в GitHub
        # Packages без тега не гейтится — это отставание в один шаг после частичного релиза (npm
        # publish прошёл, git tag/push или gh release упали); publish-шаг ниже сам пропускает
        # `npm publish`, если версия там уже есть, и идёт дальше ставить тег и релиз (docs/release.md).
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag_status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null || tag_status=$?
          if [ "$tag_status" -eq 0 ]; then
            echo "::error::Version $VERSION is already released (tag v$VERSION exists). Bump the version on develop first (chore: start ...)."
            exit 1
          fi
          if [ "$tag_status" -ne 2 ]; then
            echo "::error::Cannot check release tag (git exit $tag_status). Publication stopped."
            exit 1
          fi
          node tools/release-check.mjs > /dev/null

      - run: npm ci

      - name: Prepare Angular consumer caches
        run: |
          npm ci --prefix ng-ui-kit/tests/consumers/angular-19
          npm ci --prefix ng-ui-kit/tests/consumers/angular-base
          npm ci --prefix ng-ui-kit/tests/consumers/angular-charts
          npm ci --prefix ng-ui-kit/tests/consumers/angular-legacy

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify
        run: npm run verify

      - name: Upload migration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-diagnostics
          path: |
            .tmp/migration/
            .tmp/browser-results/
            .tmp/browser-compat-results/

      - name: Publish, tag and release (master only)
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          registry_state=$(node tools/release-check.mjs registry "$VERSION")
          if [ "$registry_state" = present ]; then
            echo "::notice::@primasoftllc/design-system@$VERSION is already in GitHub Packages — resuming a partial release, skipping npm publish."
          else
            npm publish ./.tmp/package --ignore-scripts
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          node tools/changelog-section.js "$VERSION" > release-notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md

  pages:
    name: Publish version catalogue
    needs: verify
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: v${{ needs.verify.outputs.version }}
