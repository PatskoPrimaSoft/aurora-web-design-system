<style>html,body{margin:0}*{box-sizing:border-box}

const TONE={moving:'success',parked:'neutral',offline:'danger',alarm:'warning'};

function Stage({theme,appearance,density}){
  const [q,setQ]=React.useState('');
  const [sort,setSort]=React.useState({key:'name',dir:'asc'});

    {key:'plate',label:'Номер',mono:true,width:110},
    {key:'speed',label:'Скорость',mono:true,align:'right',sortable:true,width:90,render:r=>r.speed+' км/ч'},
    {key:'state',label:'Состояние',width:130,render:r=><DsLozenge tone={TONE[r.state]} dot>{LABEL[r.state]}</DsLozenge>},
    {key:'last',label:'Последнее сообщение',mono:true,muted:true,align:'right',width:120}];
  const rows=ROWS.filter(r=>!q||r.name.toLowerCase().includes(q.toLowerCase())||r.plate.toLowerCase().includes(q.toLowerCase()));
  return <div data-ds-theme={theme} data-ds-appearance={appearance} data-ds-density={density} style={{background:'var(--ds-bg)',color:'var(--ds-fg)'}}>
    <DsAppHeader product="Aurora" env="DEV" logoSrc="components/assets/logo/AuroraWhite.png" user="a.ivanov"
      actions={<><DsIconButton icon="help" label="Справка" tone="onHeader"/><DsIconButton icon="settings" label="Настройки" tone="onHeader"/></>}>
      <DsTabs tone="onHeader" active="mon" onChange={()=>{}} items={[{id:'mon',label:'Мониторинг',icon:'map'},
        {id:'rep',label:'Отчёты',icon:'assessment'},{id:'not',label:'Уведомления',icon:'notifications',badge:3}]}/>
    </DsAppHeader>
    <div style={{padding:'var(--ds-pad-md)',display:'flex',flexDirection:'column',gap:'var(--ds-gap-md)'}}>
      <div style={{display:'flex',flexWrap:'wrap',alignItems:'flex-end',gap:'var(--ds-gap-md)'}}>
        <div style={{flex:'1 1 220px',minWidth:0}}><DsField label="Поиск объекта или номера" type="search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Название или номер"/></div>
        <span style={{font:'var(--ds-type-caption)',color:'var(--ds-fg-muted)'}}>{rows.length} из {ROWS.length}</span>
      </div>
      <DsChipGroup ariaLabel="Применённые фильтры" onClearAll={()=>setChips([])}>
        {chips.map(chip=><DsChip key={chip.id} removable onRemove={()=>setChips(current=>current.filter(c=>c.id!==chip.id))}>{chip.label}: {chip.value}</DsChip>)}
      </DsChipGroup>
      <DsTable ariaLabel="Объекты" columns={cols} rows={rows} activeId={2} sortKey={sort.key} sortDir={sort.dir} onSort={(k,d)=>setSort({key:k,dir:d})} onRowClick={()=>{}}
        footer={<><span style={{font:'var(--ds-type-caption)',color:'var(--ds-fg-muted)'}}>1–4 из 148</span>
          <span style={{marginLeft:'auto',display:'flex',gap:'var(--ds-gap-sm)'}}>
            <DsIconButton icon="chevron_left" label="Назад" size="sm" disabled/><DsIconButton icon="chevron_right" label="Вперёд" size="sm"/></span></>}/>
      <DsPanel eyebrow="Объект" title="Volvo FH16 · AC 8871-2"
        actions={<><DsLozenge tone="neutral" dot>Стоянка</DsLozenge><DsIconButton icon="more_vert" label="Ещё"/></>}
        footer={<span style={{marginLeft:'auto',display:'flex',gap:'var(--ds-gap-sm)'}}>
          <DsButton size="sm" tone="secondary">Отмена</DsButton><DsButton size="sm" icon="save">Сохранить</DsButton></span>}>
        <div style={{display:'flex',flexDirection:'column',gap:'var(--ds-gap-md)'}}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,minmax(0,1fr))',gap:'var(--ds-gap-md)'}}>
            <DsField label="Название объекта" defaultValue="Volvo FH16"/>
            <DsField label="Норма расхода топлива" placeholder="0" suffix="л/100км" mono/>
            <DsField label="Макс. скорость" defaultValue="" suffix="км/ч" error="Не может быть пустым"/></div>
          <div style={{display:'flex',gap:'var(--ds-gap-sm)',flexWrap:'wrap'}}>
            <DsChip removable onRemove={()=>{}}>Грузовики</DsChip><DsChip removable onRemove={()=>{}}>Минская база</DsChip>

        </div></DsPanel>
    </div></div>;
}

  ['Каркас приложения (пустой)','components/AppShell/preview.html']]]
];

function App(){
  const [theme,setTheme]=React.useState('DEFAULT');
  const [appearance,setAppearance]=React.useState('light');
  const [density,setDensity]=React.useState('cozy');
  const selCss={height:26,border:'1px solid var(--ds-border-field)',borderRadius:'var(--ds-radius-xs)',background:'var(--ds-surface)',color:'var(--ds-fg)',font:'var(--ds-type-caption)'};
  return <>
    <header className="cover">
      <svg viewBox="0 0 960 112" preserveAspectRatio="xMinYMin slice" aria-hidden="true">
        <defs><clipPath id="cover-slab"><rect x="0" y="-12" width="432" height="124" rx="12"/></clipPath></defs>
        {[['--ds-brand',0,432],['--ds-surface-inverse',440,192],['--ds-accent',640,120],['--ds-brand-border',768,120],['--ds-state-moving',896,76]].map(([token,x,width])=><rect key={token} x={x} y="-12" width={width} height="124" rx="12" fill={'var('+token+')'}/>)}
        <g clipPath="url(#cover-slab)" fill="none" stroke="var(--ds-accent)" strokeWidth="8" strokeLinecap="round">
          <path d="M 336 112 A 24 24 0 0 1 384 112"/>
          <path d="M 312 112 A 48 48 0 0 1 408 112"/>
          <path d="M 288 112 A 72 72 0 0 1 432 112"/>
        </g>
        <circle cx="360" cy="112" r="8" fill="var(--ds-accent)"/>
      </svg>
      <h1>Aurora Web<br/>Design System</h1>
      <p>Плотный интерфейс GPS-мониторинга автопарка.</p>
    </header>
    <header style={{display:'flex',flexDirection:'column',gap:10}}>
      <span className="eb">Aurora · дизайн-система</span>
      <h2>Один слой, одна таблица стилей</h2>
      <p>Всё здесь — система 2026 года. Легаси-слой, воспроизводивший выпущенный Angular-продукт, удалён: остался ровно один набор токенов, один набор компонентов и один способ собрать экран. Подключите <span className="mono">tokens.css</span>, <span className="mono">tokens/scoped.css</span> и <span className="mono">components/bundle.css</span> и берите компоненты из <span className="mono">components/bundle.js</span>.</p>
      <p>Старые имена Angular-компонентов и токенов всё ещё живут в исходниках продукта. Они сопоставлены один в один в <span className="mono">docs/migration.md</span> и в карточке <b style={{color:'var(--ds-fg)'}}>Миграция</b> — она нужна при передаче макета в инженерию, а не при проектировании.</p>
    </header>
    <section style={{display:'flex',flexDirection:'column',gap:10}}>
      <h2>Разделы системы</h2>
      <p>Эта страница — только вход. Ниже — полный состав: {window.__DS_CARD_COUNT__} карточек. <span className="mono">README.md</span> поможет выбрать руководство по использованию, дизайн-правилам или разработке.</p>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))',gap:'var(--ds-gap-md)',alignItems:'start'}}>
        {DOCS.map(([g,path,note,items])=><div key={g} style={{border:'1px solid var(--ds-border)',borderRadius:'var(--ds-radius-lg)',background:'var(--ds-surface)',padding:16,display:'flex',flexDirection:'column',gap:10,minWidth:0}}>
          <div style={{display:'flex',alignItems:'baseline',gap:8,flexWrap:'wrap'}}>
            <span className="eb">{g}</span>
            <span className="mono" style={{fontSize:10,color:'var(--ds-fg-subtle)',marginLeft:'auto'}}>{path}</span></div>
          <Cap>{note}</Cap>
          <div style={{display:'flex',flexDirection:'column',gap:5,borderTop:'1px solid var(--ds-divider)',paddingTop:10}}>
            {items.map(([n,href])=><a key={href} href={href} target={href.startsWith('index.html?card=')?'_top':undefined} style={{display:'flex',alignItems:'center',gap:8,font:'var(--ds-type-body)',textDecoration:'none',minWidth:0}}>
              <span className="material-symbols-outlined" style={{fontSize:'var(--ds-icon-xs)',color:'var(--ds-fg-subtle)',flex:'none'}}>chevron_right</span>
              <span style={{minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n}</span></a>)}</div>
        </div>)}
      </div>
      <p>Компоненты и токены системы носят префикс <span className="mono">Ds</span> / <span className="mono">--ds-</span>. Прежние имена с префиксом V2 и старые имена Angular сопоставлены в <span className="mono">docs/migration.md</span>.</p>
    </section>
    <section style={{display:'flex',flexDirection:'column',gap:10}}>
      <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
        <h2>Три скоупа</h2>
        <span style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8,font:'var(--ds-type-caption)',color:'var(--ds-fg-muted)'}}>
          <label style={{display:'flex',alignItems:'center',gap:5}}>тема
            <select value={theme} onChange={e=>setTheme(e.target.value)} style={selCss}>
              {['DEFAULT','RED2'].map(t=><option key={t}>{t}</option>)}</select></label>
          <label style={{display:'flex',alignItems:'center',gap:5}}>оформление
            <select value={appearance} onChange={e=>setAppearance(e.target.value)} style={selCss}><option>light</option><option>dark</option></select></label>
          <label style={{display:'flex',alignItems:'center',gap:5}}>плотность
            <select value={density} onChange={e=>setDensity(e.target.value)} style={selCss}><option>cozy</option><option>compact</option></select></label>
        </span>
      </div>
      <p><span className="mono">data-ds-theme</span> · <span className="mono">data-ds-appearance</span> · <span className="mono">data-ds-density</span> независимы и наследуются, поэтому любое поддерево может их переопределить. Проверяйте каждый экран в темах DEFAULT и RED2, в light и dark, в двух плотностях — четыре рендера, и это критерий приёмки.</p>
      <div className="stage"><Stage theme={theme} appearance={appearance} density={density}/></div>
    </section>
    <section style={{display:'flex',flexDirection:'column',gap:10}}>
      <h2>Правила, из которых следует всё остальное</h2>
      <div data-ds-theme={theme} style={{border:'1px solid var(--ds-border)',borderRadius:'var(--ds-radius-lg)',overflow:'hidden',background:'var(--ds-surface)'}}>
        {RULES.map(([k,a,demo])=><div key={k} className="rule">
          <div><div style={{font:'var(--ds-type-body-strong)'}}>{k}</div>
            <div style={{font:'var(--ds-type-caption)',color:'var(--ds-fg-muted)',marginTop:3,textWrap:'pretty'}}>{a}</div></div>
          <div className="rule-d">{demo}</div></div>)}</div>
    </section>
    <section style={{display:'flex',flexDirection:'column',gap:10}}>
      <h2>Нейтрали в работе</h2>
      <p>Компоненты никогда не читают рампу напрямую — только семантический токен. Рампа отвечает на вопрос «какой серый», семантика — на вопрос «для чего он»; менять в макете и в коде нужно второй столбец, а не первый.</p>
      <div style={{border:'1px solid var(--ds-border)',borderRadius:'var(--ds-radius-lg)',overflow:'hidden',background:'var(--ds-surface)'}}>
        <table className="diff"><thead><tr><th style={{width:130}}>Шаг</th><th style={{width:300}}>Семантический токен</th><th>Где это видно</th></tr></thead>
          <tbody>{RAMP.map(([step,hex,sem,use])=><tr key={step}>
            <td className="mono" style={{fontSize:11,whiteSpace:'nowrap'}}>
              <span style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{width:16,height:16,flex:'0 0 auto',borderRadius:'var(--ds-radius-xs)',background:hex,border:'1px solid var(--ds-border)'}}></span>{step}</span></td>
            <td className="mono" style={{fontSize:11,color:sem==='—'?'var(--ds-fg-subtle)':'var(--ds-fg)'}}>{sem}</td>
            <td style={{font:'var(--ds-type-caption)',color:'var(--ds-fg-muted)'}}>{use}</td></tr>)}</tbody></table></div>
      <p>В dark значения рампы и семантики переназначаются вместе, поэтому роль сохраняется: <span className="mono">--ds-surface</span> остаётся поверхностью, <span className="mono">--ds-border</span> — линией. Именно поэтому в макете ссылаться нужно на роль.</p>
    </section>
    <section style={{display:'flex',flexDirection:'column',gap:10}}>
      <h2>Бренд в работе</h2>
      <p>Две темы — DEFAULT и RED2 — меняют только эти значения. Свотчи ниже живут в теме, выбранной выше.</p>
      <div data-ds-theme={theme} style={{border:'1px solid var(--ds-border)',borderRadius:'var(--ds-radius-lg)',overflow:'hidden',background:'var(--ds-surface)'}}>
        <table className="diff"><thead><tr><th style={{width:210}}>Токен</th><th style={{width:120}}>Роль</th><th>Где это видно</th></tr></thead>
          <tbody>{BRAND.map(([tok,role,use])=><tr key={tok}>
            <td className="mono" style={{fontSize:11,whiteSpace:'nowrap'}}>
              <span style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{width:16,height:16,flex:'0 0 auto',borderRadius:'var(--ds-radius-xs)',background:'var('+tok+')',border:'1px solid var(--ds-border)'}}></span>{tok}</span></td>
            <td>{role}</td>
            <td style={{font:'var(--ds-type-caption)',color:'var(--ds-fg-muted)'}}>{use}</td></tr>)}</tbody></table></div>
      <p>Hover и press не имеют брендовых значений: это универсальная накладка в собственных чернилах контрола (<span className="mono">--ds-overlay-hover</span> 10% · <span className="mono">--ds-overlay-press</span> 16%), поэтому залитому тону нужен один цвет, а не три. Акцент (<span className="mono">--ds-accent</span>) — не бренд: он живёт только в счётчике уведомлений и точке непрочитанного.</p>
    </section>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
