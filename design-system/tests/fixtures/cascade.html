<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../../dist/styles.css">
</head>
<body>
  <div id="c-default-light" data-ds-theme="DEFAULT" data-ds-appearance="light" data-ds-density="cozy"></div>
  <div id="c-default-dark" data-ds-theme="DEFAULT" data-ds-appearance="dark" data-ds-density="compact"></div>
  <div id="c-red2-light" data-ds-theme="RED2" data-ds-appearance="light" data-ds-density="cozy"></div>
  <div id="c-red2-dark" data-ds-theme="RED2" data-ds-appearance="dark" data-ds-density="compact"></div>
  <div data-ds-theme="DEFAULT" data-ds-appearance="light" data-ds-density="cozy">
    <div id="n-dark-in-light" data-ds-appearance="dark"></div>
    <div id="n-red2-in-default" data-ds-theme="RED2"></div>
  </div>
  <div data-ds-theme="RED2" data-ds-appearance="light" data-ds-density="cozy">
    <div id="n-compact-in-red2" data-ds-density="compact"></div>
  </div>
  <div data-ds-theme="DEFAULT" data-ds-appearance="dark" data-ds-density="cozy">
    <div id="n-red2-light-in-dark" data-ds-theme="RED2" data-ds-appearance="light"></div>
  </div>
  <div id="bare-compact" data-ds-density="compact"></div>
  <pre id="out"></pre>
  <script>
    // Все кастомные свойства --ds-* каждого элемента: Chrome перечисляет их в getComputedStyle.
    const out = {};
    for (const el of document.querySelectorAll('[id^="c-"],[id^="n-"],[id^="bare-"]')) {
      const cs = getComputedStyle(el);
      const props = [...cs].filter((p) => p.startsWith('--ds-'));
      out[el.id] = Object.fromEntries(props.map((p) => [p, cs.getPropertyValue(p).trim().toLowerCase()]));
    }
    document.getElementById('out').textContent = JSON.stringify(out);
  </script>
</body>
</html>
