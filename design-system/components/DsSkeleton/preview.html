<!-- @dsCard layout="component" scopeMode="inherit" group="5 · Компоненты · обратная связь" height=680 subtitle="Показывает форму содержимого, пока загружаются данные" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
.shapes{display:flex;align-items:center;flex-wrap:wrap;gap:24px}
.lines{display:flex;flex-direction:column;gap:10px;width:180px;max-width:100%}
.list{display:flex;flex-direction:column;gap:16px;max-width:420px}
.row{display:flex;align-items:center;gap:12px;min-width:0;min-height:40px}
.row>span:first-child{flex:none}
.text{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.name-slot{height:20px;display:flex;align-items:center;min-width:0}
.detail-slot{height:16px;display:flex;align-items:center;min-width:0}
.name{font:var(--ds-type-body-strong);line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{font:var(--ds-type-caption);line-height:16px;color:var(--ds-fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--ds-surface-active);color:var(--ds-fg-muted);flex:none}
.toolbar{margin-bottom:16px}
.status{font:var(--ds-type-caption);color:var(--ds-fg-muted);margin:12px 0 0}
</style></head><body data-ds-examples><div id="root"></div><script type="application/json" id="example-code-sources" data-ds-example-sources="examples.json"></script><script type="text/babel">
const S = window.AuroraWebDesignSystem_96e210;
const { LiveExamples, LiveExample } = window.DsLiveExamples;
var people = [['Анна Смирнова', 'Администратор', 'АС'], ['Иван Петров', 'Диспетчер', 'ИП'], ['Мария Волкова', 'Диспетчер', 'МВ']];
function LoadingList() { return <div className={'list'}>
{people.map(function (_, i) { return <div className={'row'} key={i}>
<S.DsSkeleton width={40} height={40} radius={'50%'}/>
<div className={'text'}>
<div className={'name-slot'}>
<S.DsSkeleton width={[70, 90, 55][i] + '%'} height={14}/>
</div>
<div className={'detail-slot'}>
<S.DsSkeleton width={'45%'} height={10}/>
</div>
</div>
</div>; })}
</div>; }
function LoadingExample() {
    var loading = React.useState(true), timer = React.useRef(null), pending = React.useRef(false);
    function load() {
        if (pending.current)
            return;
        pending.current = true;
        loading[1](true);
        timer.current = setTimeout(function () { pending.current = false; loading[1](false); }, 1200);
    }
    React.useEffect(function () { load(); return function () { clearTimeout(timer.current); pending.current = false; }; }, []);
    return <div className={"demo-stack"}>
    <div className={'toolbar'}>
    <S.DsButton tone={'secondary'} onClick={load} aria-disabled={loading[0]}>
    {'Повторить загрузку'}
    </S.DsButton>
    </div>
    <div aria-busy={loading[0]} aria-label={'Пользователи'} role={'region'}>
    {loading[0] ? <LoadingList /> : <div className={'list'}>
    {people.map(function (person, i) { return <div className={'row'} key={i}>
    <span className={'avatar'} aria-hidden={true}>
    {person[2]}
    </span>
    <div className={'text'}>
    <div className={'name-slot'}>
    <span className={'name'}>
    {person[0]}
    </span>
    </div>
    <div className={'detail-slot'}>
    <span className={'detail'}>
    {person[1]}
    </span>
    </div>
    </div>
    </div>; })}
    </div>}
    </div>
    <p className={'status'} role={'status'}>
    {loading[0] ? 'Загрузка пользователей…' : 'Загружено 3 пользователя.'}
    </p>
    </div>;
}
function App() {
    return <LiveExamples>
    <LiveExample id={"live"} title={"Переход к загруженным данным"} description={"Запустите загрузку: скелетон сменяется реальным содержимым."}>
    <LoadingExample />
    </LiveExample>
    <LiveExample id={"shapes"} title={"Формы и размеры"} description={"Скелетон повторяет форму ожидаемого содержимого, не показывая фиктивные данные."}>
    <div className={"demo-stack"}>
    <div className={'shapes'}>
    <div className={'lines'}>
    <S.DsSkeleton height={16}/>
    <S.DsSkeleton width={'75%'}/>
    <S.DsSkeleton width={'50%'} height={10}/>
    </div>
    <S.DsSkeleton width={40} height={40} radius={'50%'}/>
    <S.DsSkeleton width={96} height={64} radius={'var(--ds-radius-md)'}/>
    </div>
    </div>
    </LiveExample>
    <LiveExample id={"static"} title={"Без анимации"} description={"Статический вариант подходит, когда движение отвлекает или ограничено настройками пользователя."}>
    <div className={"demo-stack"}>
    <S.DsSkeleton animated={false} width={180} height={16}/>
    </div>
    </LiveExample>
    <LiveExample id={"list"} title={"Список во время загрузки"} description={"Повторите структуру будущих строк, чтобы сохранить предсказуемую компоновку."}>
    <div className={"demo-stack"}>
    <div aria-busy={true} role={'region'} aria-label={'Загружаемый список'}>
    <LoadingList />
    </div>
    <p className={'status'}>
    {'Загрузка пользователей…'}
    </p>
    </div>
    </LiveExample>
    </LiveExamples>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
