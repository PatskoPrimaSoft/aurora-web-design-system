function Chrome({state,set,children,label}){
  const {theme,appearance,density}=state;
  return <div data-ds-theme={theme} data-ds-appearance={appearance} data-ds-density={density}
    style={{height:'100%',display:'flex',flexDirection:'column',background:'var(--ds-bg)',color:'var(--ds-fg)'}}>
    <div style={{flex:'none',display:'flex',alignItems:'center',gap:10,padding:'6px 12px',background:'var(--ds-surface)',
      borderBottom:'1px solid var(--ds-border)',font:'var(--ds-type-caption)',color:'var(--ds-fg-muted)'}}>
      <span className="eb">{label}</span>
      <span style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
        <label style={{display:'flex',alignItems:'center',gap:5}}>тема
          <select value={theme} onChange={e=>set({theme:e.target.value})} style={selCss}>
            {['DEFAULT','RED2'].map(t=><option key={t}>{t}</option>)}</select></label>
        <Seg value={appearance} set={v=>set({appearance:v})} opts={[['light','light'],['dark','dark']]}/>
        <Seg value={density} set={v=>set({density:v})} opts={[['cozy','cozy'],['compact','compact']]}/>
      </span></div>
    <div style={{flex:1,minHeight:0}}>{children}</div>
  </div>;
}

function Seg({value,set,opts}){return <span style={{display:'inline-flex',border:'1px solid var(--ds-border-field)',borderRadius:'var(--ds-radius-xs)',overflow:'hidden'}}>
  {opts.map(([v,l])=><button key={v} onClick={()=>set(v)} style={{height:24,padding:'0 9px',border:'none',cursor:'pointer',font:'var(--ds-type-caption)',

function useChrome(){const [s,setS]=React.useState({theme:'DEFAULT',appearance:'light',density:'cozy'});
