<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;align-items:start}
.cap{font:var(--ds-type-caption);color:var(--ds-fg-muted)}.form{display:flex;flex-direction:column;gap:12px;max-width:420px}.legacy{padding-top:8px;max-width:420px}
</style></head><body data-ds-examples><div id="root"></div><script type="application/json" id="example-code-sources" data-ds-example-sources="examples.json"></script><script type="text/babel">
const S = window.AuroraWebDesignSystem_96e210;
const { LiveExamples, LiveExample } = window.DsLiveExamples;
function App() {
    var imei = React.useState('356938035643809'), error = React.useState(''), saved = React.useState(''), mode = React.useState('top'), name = React.useState(''), access = React.useState('disabled'), note = React.useState('Проверить датчик топлива перед следующим рейсом.'), grow = React.useState(true), touched = React.useRef(false), imeiRef = React.useRef(null);
    function validate(v) { return /^[0-9]{15}$/.test(v) ? '' : 'Введите IMEI из 15 цифр.'; }
    function submit(e) {
        e.preventDefault();
        touched.current = true;
        var message = validate(imei[0]);
        if (message) {
            error[1](message);
            saved[1]('');
            imeiRef.current.focus();
            return;
        }
        error[1]('');
        saved[1]('IMEI сохранён: ' + imei[0]);
    }
    return <LiveExamples>
    <LiveExample id={"varianty-vvoda"} title={"Варианты ввода"} description={"Выберите подходящий вид ввода: текст, число, дату или значение из списка."}>
    <div className={"demo-stack"}>
    <div className={'grid'}>
    <S.DsField id={'field-name'} label={'Название объекта'} defaultValue={'MAZ 5440'} placeholder={'Введите название'}/>
    <S.DsField id={'field-speed'} label={'Максимальная скорость'} type={'number'} defaultValue={'90'} suffix={'км/ч'} mono={true} min={0}/>
    <S.DsSelect id={'field-group'} label={'Группа'} options={[{ value: 'trucks', label: 'Грузовики' }, { value: 'vans', label: 'Фургоны' }, { value: 'cars', label: 'Легковые' }]} defaultValue={'trucks'}/>
    <S.DsField id={'field-date'} label={'Дата проверки'} type={'date'} defaultValue={'2026-10-09'}/>
    </div>
    </div>
    </LiveExample>
    <LiveExample id={"podskazka-i-proverka"} title={"Подсказка и проверка"} description={"Исправьте IMEI и сохраните его: ошибка объясняет формат и возвращает фокус к полю."}>
    <div className={"demo-stack"}>
    <form className={'form'} onSubmit={submit} noValidate={true}>
    <S.DsField id={'field-imei'} ref={imeiRef} name={'imei'} inputMode={'numeric'} autoComplete={'off'} label={'IMEI устройства'} value={imei[0]} onChange={function (e) {
        imei[1](e.target.value);
        if (touched.current)
            error[1](validate(e.target.value));
        saved[1]('');
    }} onBlur={function () {
        if (imei[0]) {
            touched.current = true;
            error[1](validate(imei[0]));
        }
    }} icon={'sensors'} mono={true} required={true} hint={'С шильдика устройства, 15 цифр.'} error={error[0]}/>

    <S.DsButton type={'submit'}>
    {'Сохранить IMEI'}
    </S.DsButton>
    <S.DsButton tone={'secondary'} onClick={function () { imei[1](''); error[1](''); saved[1](''); touched.current = false; imeiRef.current.focus(); }}>
    {'Очистить'}
    </S.DsButton>
    </div>
    <p className={'cap'} role={'status'}>
    {error[0] || saved[0]}
    </p>
    </form>
    <p className={'cap'}>
    {'Проверка выполняется после выхода из заполненного поля и при сохранении. Исправляйте значение без повторной отправки; при ошибке сохранение возвращает фокус к полю.'}
    </p>
    </div>
    </LiveExample>
    <LiveExample id={"redaktirovanie-chtenie-i-nedostupnost"} title={"Редактирование, чтение и недоступность"} description={"Переключите режим доступа: чтение позволяет копировать значение, недоступность запрещает изменение."}>

    <div className={'row'} role={'group'} aria-label={'Доступность поля'}>
    {[['edit', 'Редактирование'], ['read', 'Только чтение'], ['disabled', 'Недоступно']].map(function (item) { return <S.DsButton key={item[0]} tone={access[0] === item[0] ? 'primary' : 'secondary'} aria-pressed={access[0] === item[0]} onClick={function () { access[1](item[0]); }}>
    {item[1]}
    </S.DsButton>; })}
    </div>
    <div className={'form'}>
    <S.DsField id={'field-owner'} label={'Владелец'} defaultValue={'TransBel'} disabled={access[0] === 'disabled'} readOnly={access[0] === 'read'} hint={access[0] === 'disabled' ? 'Редактирование недоступно: нужны права администратора.' : access[0] === 'read' ? 'Значение можно выделить и скопировать.' : 'Измените владельца.'}/>
    </div>
    </div>
    </LiveExample>
    <LiveExample id={"mnogostrochnyy-tekst"} title={"Многострочный текст"} description={"Добавляйте текст и сравните фиксированную и автоматически растущую высоту поля."}>

    <div className={'row'}>
    <S.DsButton tone={grow[0] ? 'primary' : 'secondary'} aria-pressed={grow[0]} onClick={function () { grow[1](!grow[0]); }}>
    {'Автоматическая высота'}
    </S.DsButton>
    </div>
    <S.DsField id={'field-note'} name={'note'} label={'Примечание'} as={'textarea'} value={note[0]} onChange={function (e) { note[1](e.target.value); }} rows={3} autoResize={grow[0]} maxHeight={180} maxLength={300} showCount={true} hint={'До 300 символов. Поле растёт до 180 px, затем прокручивается.'}/>
    </div>
    </LiveExample>
    <LiveExample id={"raspolozhenie-podpisi"} title={"Расположение подписи"} description={"Для новых форм используйте подпись над полем; вариант в рамке помогает при постепенном переносе форм."}>
    <div className={"demo-stack"}>
    <div className={'row'} role={'group'} aria-label={'Расположение подписи'}>
    {[['top', 'Над полем'], ['notch', 'В рамке']].map(function (item) { return <S.DsButton key={item[0]} tone={mode[0] === item[0] ? 'primary' : 'secondary'} aria-pressed={mode[0] === item[0]} onClick={function () { mode[1](item[0]); }}>
    {item[1]}
    </S.DsButton>; })}
    </div>
    <div className={'legacy'}>
    <S.DsField id={'field-label-mode'} label={'Название группы'} value={name[0]} onChange={function (e) { name[1](e.target.value); }} required={true} labelMode={mode[0]}/>
    </div>
    <p className={'cap'}>
    {'Для новых форм используйте подпись над полем. Вариант в рамке предназначен для соседства с ещё не перенесёнными формами.'}
    </p>
    </div>
    </LiveExample>
    </LiveExamples>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
