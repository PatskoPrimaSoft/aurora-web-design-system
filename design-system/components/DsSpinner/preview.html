<!-- @dsCard layout="component" scopeMode="inherit" group="5 · Компоненты · обратная связь" height=720 subtitle="Показывает, что операция выполняется, когда её прогресс неизвестен" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
.variants{display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.sample{display:flex;flex-direction:column;align-items:center;gap:8px}
.cap{font:var(--ds-type-caption);color:var(--ds-fg-muted)}
.toolbar{margin-bottom:16px}
.result{display:flex;align-items:center;gap:12px;min-height:48px;overflow-wrap:anywhere}
.spinner-slot{width:32px;height:32px;flex:none}
.data{min-width:0;flex:1}
.data p{margin:0}
.data[aria-busy="true"]{color:var(--ds-fg-muted)}
.message{font:var(--ds-type-caption);color:var(--ds-fg-muted);min-height:36px;margin:8px 0 0;overflow-wrap:anywhere}
</style></head><body data-ds-examples><div id="root"></div><script type="application/json" id="example-code-sources" data-ds-example-sources="examples.json"></script><script type="text/babel">
const S = window.AuroraWebDesignSystem_96e210;
const { LiveExamples, LiveExample } = window.DsLiveExamples;
function LoadExample(props) {
    var retry = props.retry, state = React.useState('idle'), timer = React.useRef(null), pending = React.useRef(false), attempt = React.useRef(0);
    var loading = state[0] === 'loading', error = state[0] === 'error', done = state[0] === 'done';
    React.useEffect(function () { return function () { clearTimeout(timer.current); }; }, []);
    function load() {
        if (pending.current)
            return;
        pending.current = true;
        attempt.current++;
        state[1]('loading');
        timer.current = setTimeout(function () { pending.current = false; state[1](retry && attempt.current % 2 === 1 ? 'error' : 'done'); }, 1500);
    }
    var message = loading ? (retry ? 'Загрузка отчёта…' : 'Обновление отчёта…') : error ? 'Не удалось загрузить отчёт. Повторите попытку.' : done ? (retry ? 'Отчёт загружен.' : 'Отчёт обновлён.') : '';
    return <div className={"demo-stack"}>
    <div className={'toolbar'}>
    <S.DsButton variant={'secondary'} onClick={load} aria-disabled={loading}>
    {retry ? (error ? 'Повторить загрузку' : 'Загрузить отчёт') : 'Обновить отчёт'}
    </S.DsButton>
    </div>
    <div className={'result'}>
    <div className={'spinner-slot'} aria-hidden={'true'}>
    {loading ? <S.DsSpinner size={32}/> : null}
    </div>
    <div className={'data'} aria-busy={loading}>
    <p>
    {retry && !done ? 'Отчёт ещё не загружен.' : 'Отчёт: 24 объекта.'}
    </p>
    </div>
    </div>
    <p role={'status'} className={'message'}>
    {message}
    </p>
    </div>;
}
function App() {
    return <LiveExamples>
    <LiveExample id={"obnovlenie-suschestvuyuschih-dannyh"} title={"Обновление существующих данных"} description={"Во время обновления прежние данные остаются видимыми, а индикатор сообщает об ожидании."}>
    <LoadExample />
    </LiveExample>
    <LiveExample id={"razmery"} title={"Размеры"} description={"Сравните доступные размеры. Для связанных элементов используйте одинаковый размер."}>
    <div className={"demo-stack"}>
    <div className={'variants'} aria-hidden={'true'}>
    {[16, 20, 32, 48].map(function (size) { return <div className={'sample'} key={size}>
    <S.DsSpinner size={size} label={'Пример загрузки, ' + size + ' px'}/>
    <span className={'cap'}>
    {size + ' px'}
    </span>
    </div>; })}
    </div>
    </div>
    </LiveExample>
    <LiveExample id={"tsvet"} title={"Цвет"} description={"Сравните нейтральный и брендовый индикаторы."}>
    <div className={"demo-stack"}>
    <div className={'variants'} aria-hidden={'true'}>
    <div className={'sample'}>
    <S.DsSpinner tone={'brand'} label={'Пример брендового индикатора'}/>
    <span className={'cap'}>
    {'brand'}
    </span>
    </div>
    <div className={'sample'}>
    <S.DsSpinner tone={'muted'} label={'Пример нейтрального индикатора'}/>
    <span className={'cap'}>
    {'muted'}
    </span>
    </div>
    </div>
    </div>
    </LiveExample>
    <LiveExample id={"oshibka-i-povtornaya-popytka"} title={"Ошибка и повторная попытка"} description={"Повторите операцию после ошибки и проверьте сообщение о результате."}>
    <LoadExample retry={true}/>
    </LiveExample>
    </LiveExamples>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
