<!-- @dsCard layout="component" scopeMode="inherit" group="5 · Компоненты · формы" height=480 subtitle="Переключение настройки, которая применяется сразу" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
section+section{margin-top:24px}
.stack{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.hint{font:var(--ds-type-caption);color:var(--ds-fg-muted);margin:12px 0 0}
.result{margin:12px 0 0;color:var(--ds-fg-subtle)}
</style></head><body data-ds-examples><div id="root"></div><script type="application/json" id="example-code-sources" data-ds-example-sources="examples.json"></script><script type="text/babel">
const S = window.AuroraWebDesignSystem_96e210;
const { LiveExamples, LiveExample } = window.DsLiveExamples;
function App() {
    var off = React.useState(false), on = React.useState(true), clusters = React.useState(false), tracks = React.useState(true), saved = React.useState(false), busy = React.useState(false), fail = React.useState(false), message = React.useState(''), timer = React.useRef(null);
    React.useEffect(function () { return function () { clearTimeout(timer.current); }; }, []);
    function save(event) {
        var previous = saved[0];
        saved[1](event.target.checked);
        busy[1](true);
        message[1]('');
        timer.current = setTimeout(function () {
            busy[1](false);
            if (fail[0]) {
                saved[1](previous);
                message[1]('Не удалось сохранить настройку. Попробуйте ещё раз.');
            }
            else
                message[1]('Настройка сохранена.');
        }, 1800);
    }
    function change(state) { return function (event) { state[1](event.target.checked); }; }
    return <LiveExamples>
    <LiveExample id={"nemedlennoe-primenenie"} title={"Немедленное применение"} description={"Переключите настройку: новое значение применяется сразу."}>
    <div className={"demo-stack"}>
    <S.DsSwitch label={'Показывать треки'} checked={tracks[0]} onChange={change(tracks)}/>
    <p className={'result'} role={'status'}>
    {tracks[0] ? 'Треки отображаются на карте.' : 'Треки скрыты.'}
    </p>
    </div>
    </LiveExample>
    <LiveExample id={"varianty-i-sostoyaniya"} title={"Варианты и состояния"} description={"Сравните включённое, выключенное и недоступное состояния переключателя."}>
    <div className={"demo-stack"}>
    <div className={'stack'}>
    <S.DsSwitch label={'Уведомления о событиях'} checked={off[0]} onChange={change(off)}/>
    <S.DsSwitch label={'Звуковые уведомления'} checked={on[0]} onChange={change(on)}/>
    <S.DsSwitch label={'Автоматическое обновление'} description={'Недоступно без подключения к серверу'} disabled={true} checked={false}/>
    <S.DsSwitch label={'Системные уведомления'} description={'Управляется администратором'} disabled={true} checked={true}/>
    </div>
    <p className={'hint'}>
    {'Переключайте доступные настройки нажатием на подпись или клавишей Space.'}
    </p>
    </div>
    </LiveExample>
    <LiveExample id={"s-poyasneniem"} title={"С пояснением"} description={"Подпись объясняет настройку, а дополнительный текст уточняет её действие."}>
    <div className={"demo-stack"}>
    <S.DsSwitch label={'Кластеризация объектов'} description={'Группирует близкие метки при отдалении карты'} checked={clusters[0]} onChange={change(clusters)}/>
    </div>
    </LiveExample>
    <LiveExample id={"sohranenie-nastroyki"} title={"Сохранение настройки"} description={"Переключите настройку и дождитесь подтверждения сохранения."}>
    <div className={"demo-stack"}>
    <div className={'stack'}>
    <S.DsSwitch label={'Автоматическое обновление карты'} description={'Настройка сохраняется на сервере'} checked={saved[0]} loading={busy[0]} onChange={save}/>
    <S.DsCheckbox label={'Имитировать ошибку сохранения'} state={fail[0] ? 'checked' : 'unchecked'} disabled={busy[0]} onChange={function (value) { fail[1](value === 'checked'); }}/>
    </div>
    <p className={'result'} role={'status'}>
    {message[0]}
    </p>
    </div>
    </LiveExample>
    </LiveExamples>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
