<!-- @dsCard layout="component" scopeMode="inherit" group="5 · Компоненты · данные" height=390 subtitle="Группа связанных чипов с переносом строк и общей очисткой" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
.cap{font:var(--ds-type-caption);color:var(--ds-fg-muted);margin:0}
</style></head><body data-ds-examples><div id="root"></div><script type="application/json" id="example-code-sources" data-ds-example-sources="examples.json"></script><script type="text/babel">
const S = window.AuroraWebDesignSystem_96e210;
const { LiveExamples, LiveExample } = window.DsLiveExamples;
var names = ['Грузовики', 'Легковые', 'Спецтехника', 'Автобусы', 'Прицепы'];
function App() {
    var selected = React.useState(['Грузовики']), values = React.useState(names), message = React.useState('');
    function update(next, text) { values[1](next); message[1](text); document.getElementById('restore-group').focus(); }
    return <LiveExamples>
    <LiveExample id={"tipy-obektov"} title={"Типы объектов"} description={"Выбирайте связанные фильтры в одной группе; элементы переносятся при уменьшении ширины."}>
    <div className={"demo-stack"}>
    <S.DsChipGroup ariaLabel={'Типы объектов'} onClearAll={selected[0].length ? function () { selected[1]([]); document.querySelector('[role="group"][aria-label="Типы объектов"] button').focus(); } : undefined} clearAllLabel={'Снять выбор'}>
    {names.map(function (name) { return <S.DsChip key={name} selected={selected[0].includes(name)} onClick={function () { selected[1](selected[0].includes(name) ? selected[0].filter(function (n) { return n !== name; }) : selected[0].concat(name)); }}>
    {name}
    </S.DsChip>; })}
    </S.DsChipGroup>
    <p className={'cap'} role={'status'}>
    {'Выбрано типов: ' + selected[0].length + '.'}
    </p>
    </div>
    </LiveExample>
    <LiveExample id={"vybrannye-gruppy"} title={"Выбранные группы"} description={"Удаляйте отдельные группы или очищайте весь набор одним действием."}>
    <div className={"demo-stack"}>
    <div>
    <S.DsButton id={'restore-group'} tone={'secondary'} size={'sm'} onClick={function () { values[1](names); message[1]('Группы восстановлены.'); }}>
    {'Восстановить группы'}
    </S.DsButton>
    </div>
    <S.DsChipGroup ariaLabel={'Выбранные группы'} onClearAll={function () { update([], 'Все группы удалены.'); }}>
    {values[0].map(function (name) { return <S.DsChip key={name} removable={true} onRemove={function () { update(values[0].filter(function (n) { return n !== name; }), 'Удалена группа «' + name + '».'); }}>
    {name}
    </S.DsChip>; })}
    </S.DsChipGroup>
    <p className={'cap'} role={'status'}>
    {message[0] || 'Удалите отдельную группу или очистите все.'}
    </p>
    </div>
    </LiveExample>
    <LiveExample id={"kategorii"} title={"Категории"} description={"Постоянные метки показывают принадлежность объекта и не предлагают действие удаления."}>
    <div className={"demo-stack"}>
    <S.DsChipGroup ariaLabel={'Категории'}>
    <S.DsChip>
    {'Служебный транспорт'}
    </S.DsChip>
    <S.DsChip>
    {'Междугородние перевозки'}
    </S.DsChip>
    <S.DsChip>
    {'Северо-западное подразделение'}
    </S.DsChip>
    </S.DsChipGroup>
    </div>
    </LiveExample>
    </LiveExamples>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
