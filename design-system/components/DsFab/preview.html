<!-- @dsCard layout="component" scopeMode="inherit" group="5 · Компоненты · кнопки" height=1300 subtitle="Плавающая кнопка для основного действия над содержимым" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.sample{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.cap{font:var(--ds-type-caption);color:var(--ds-fg-muted)}
.stage{position:relative;min-height:240px;padding:16px 16px 88px;background:var(--ds-bg);border:1px solid var(--ds-border);border-radius:var(--ds-radius-md)}
.stage-action{position:absolute;right:16px;bottom:16px}
.items{margin:12px 0 0;padding-left:24px;overflow-wrap:anywhere}
.object-form{display:flex;flex-direction:column;gap:16px;max-width:360px;min-width:0}
.form-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:12px}
</style></head><body data-ds-examples><div id="root"></div><script type="application/json" id="example-code-sources" data-ds-example-sources="examples.json"></script><script type="text/babel">
const S = window.AuroraWebDesignSystem_96e210;
const { LiveExamples, LiveExample } = window.DsLiveExamples;
function Placement() {
    var objects = React.useState(['Volvo FH16', 'Scania R450', 'MAN TGX']), setObjects = objects[1];
    var open = React.useState(false), setOpen = open[1], name = React.useState(''), setName = name[1];
    var error = React.useState(''), setError = error[1], message = React.useState(''), setMessage = message[1];
    var formRef = React.useRef(null), trigger = React.useRef(null), wasOpen = React.useRef(false);
    React.useLayoutEffect(function () {
        if (open[0])
            formRef.current.querySelector('input').focus();
        else if (wasOpen.current)
            trigger.current.focus();
        wasOpen.current = open[0];
    }, [open[0]]);
    function start(e) {
        trigger.current = e.currentTarget;
        if (open[0]) {
            formRef.current.querySelector('input').focus();
            return;
        }
        setName('');
        setError('');
        setMessage('');
        setOpen(true);
    }
    function cancel() { setOpen(false); setMessage('Добавление отменено.'); }
    function submit(e) {
        e.preventDefault();
        var value = name[0].trim();
        if (!value) {
            setError('Введите название объекта.');
            formRef.current.querySelector('input').focus();
            return;
        }
        setObjects(function (items) { return items.concat(value); });
        setOpen(false);
        setMessage('Объект «' + value + '» добавлен.');
    }
    return <div className={"demo-stack"}>
    <div className={'stage'}>
    <p>
    {'Объекты'}
    </p>
    <ul className={'items'}>
    {objects[0].map(function (item, i) { return <li key={i}>
    {item}
    </li>; })}
    </ul>
    <div className={'stage-action'}>
    <S.DsFab label={'Добавить объект'} extended={true} aria-expanded={open[0]} aria-controls={open[0] ? 'object-form' : undefined} onClick={start}/>
    </div>
    </div>
    {open[0] ? <form id={'object-form'} ref={formRef} className={'object-form'} noValidate={true} aria-label={'Добавление объекта'} onSubmit={submit}>
    <S.DsField label={'Название объекта'} required={true} value={name[0]} error={error[0] || undefined} onChange={function (e) { setName(e.target.value); setError(''); }}/>
    <div className={'form-actions'}>
    <S.DsButton tone={'secondary'} onClick={cancel}>
    {'Отмена'}
    </S.DsButton>
    <S.DsButton type={'submit'}>
    {'Добавить'}
    </S.DsButton>
    </div>
    </form> : null}
    <p role={'status'} aria-label={'Результат создания объекта'}>
    {message[0]}
    </p>
    </div>;
}
function App() {
    var message = React.useState('Нажмите кнопку, чтобы выполнить действие.'), setMessage = message[1];
    var saving = React.useState(false), setSaving = saving[1], saved = React.useState('Готово к добавлению.'), setSaved = saved[1];
    var timer = React.useRef(null);
    React.useEffect(function () { return function () { clearTimeout(timer.current); }; }, []);
    function save() { setSaving(true); setSaved('Добавляем объект…'); timer.current = setTimeout(function () { setSaving(false); setSaved('Объект добавлен.'); }, 1200); }
    function sample(caption, props) { return <div className={'sample'} key={caption}>
    <span className={'cap'}>
    {caption}
    </span>
    <S.DsFab {...Object.assign({ label: 'Добавить объект', onClick: function () { setMessage('Действие «' + caption + '» выполнено.'); } }, props)}/>
    </div>; }
    return <LiveExamples>
    <LiveExample id={"placement"} title={"Действие над содержимым"} description={"Плавающая кнопка относится к содержимому рабочей области и не перекрывает важные элементы."}>
    <Placement />
    </LiveExample>
    <LiveExample id={"sizes"} title={"Размеры"} description={"Сравните доступные размеры. Для связанных элементов используйте одинаковый размер."}>
    <div className={"demo-stack"}>
    <div className={"demo-stack"}>
    <div className={'row'}>
    {sample('sm · 40 px', { size: 'sm' })}
    {sample('md · 48 px', {})}
    {sample('lg · 56 px', { size: 'lg' })}
    </div>
    </div>
    <p role={'status'} aria-label={'Результат действия'}>
    {message[0]}
    </p>
    </div>
    </LiveExample>
    <LiveExample id={"tones"} title={"Тоны"} description={"Выберите акцент по значимости действия: главное, дополнительное или разрушительное."}>
    <div className={"demo-stack"}>
    <div className={'row'}>
    {sample('primary', {})}
    {sample('accent', { tone: 'accent', icon: 'fence', label: 'Добавить геозону' })}
    {sample('surface', { tone: 'surface', icon: 'my_location', label: 'Центрировать карту' })}
    </div>
    </div>
    <p className="cap" role="status" aria-label="Результат действия">{message[0]}</p>
    </LiveExample>
    <LiveExample id={"extended"} title={"С подписью"} description={"Добавьте короткую подпись, если одной иконки недостаточно для понимания действия."}>
    <div className={"demo-stack"}>
    <div className={'row'}>
    {sample('Круглая', {})}
    {sample('Расширенная', { extended: true })}
    </div>
    </div>
    <p className="cap" role="status" aria-label="Результат действия">{message[0]}</p>
    </LiveExample>
    <LiveExample id={"loading"} title={"Загрузка"} description={"Запустите операцию: индикатор сообщает об ожидании и предотвращает повторное действие."}>
    <div className={"demo-stack"}>
    <div className={'row'}>
    <S.DsFab label={'Добавить объект'} loading={saving[0]} onClick={save}/>
    <S.DsFab label={'Добавить объект'} extended={true} loading={saving[0]} onClick={save}/>
    </div>
    <p role={'status'} aria-label={'Результат добавления'}>
    {saved[0]}
    </p>
    </div>
    </LiveExample>
    <LiveExample id={"long-label"} title={"Длинная подпись"} description={"Проверьте, как подпись помещается в узкой области; доступное имя сохраняется полностью."}>
    <div className={"demo-stack"}>
    <div style={{ width: 220, maxWidth: '100%' }}>
    <S.DsFab label={'Добавить объект в выбранную группу'} extended={true} onClick={function () { setMessage('Объект добавлен в выбранную группу.'); }}/>
    </div>
    </div>
    <p className="cap" role="status" aria-label="Результат действия">{message[0]}</p>
    </LiveExample>
    <LiveExample id={"disabled"} title={"Недоступное действие"} description={"Недоступное действие нельзя выполнить. Видимое пояснение помогает понять причину ограничения."}>
    <div className={"demo-stack"}>
    <div className={'row'}>
    {sample('Круглая', { disabled: true, 'aria-describedby': 'disabled-reason' })}
    {sample('Расширенная', { extended: true, disabled: true, 'aria-describedby': 'disabled-reason' })}
    </div>
    <p id={'disabled-reason'} className={'cap'}>
    {'Добавление доступно администратору. Обратитесь к администратору проекта.'}
    </p>
    </div>
    </LiveExample>
    </LiveExamples>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
