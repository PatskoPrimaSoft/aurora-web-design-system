<!-- @dsCard layout="component" scopeMode="inherit" group="5 · Компоненты · обратная связь" height=1600 subtitle="Сообщение об условии или проблеме рядом с содержимым страницы" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
.variants{display:flex;flex-direction:column;gap:12px}
.text-link{color:var(--ds-brand-text);text-underline-offset:3px;overflow-wrap:anywhere}
.text-link:hover{text-decoration-thickness:2px}
.help{margin-top:12px;padding:12px;border:1px solid var(--ds-border);border-radius:var(--ds-radius-lg)}
.help h4{font:var(--ds-type-label);margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
</style></head><body data-ds-examples><div id="root"></div><script type="application/json" id="example-code-sources" data-ds-example-sources="examples.json"></script><script type="text/babel">
const S = window.AuroraWebDesignSystem_96e210;
const { LiveExamples, LiveExample } = window.DsLiveExamples;
function RetryExample() {
    var phase = React.useState('error'), attempts = React.useState(0), timer = React.useRef(null);
    React.useEffect(function () { return function () { clearTimeout(timer.current); }; }, []);
    function retry() {
        if (phase[0] === 'loading')
            return;
        if (phase[0] === 'ready') {
            phase[1]('error');
            attempts[1](0);
            return;
        }
        phase[1]('loading');
        attempts[1](function (count) { return count + 1; });
        timer.current = setTimeout(function () { phase[1]('ready'); }, 1200);
    }
    var title = phase[0] === 'ready' ? 'Соединение восстановлено' : phase[0] === 'loading' ? 'Загружаем отчёт' : 'Не удалось загрузить отчёт';
    var body = phase[0] === 'ready' ? 'Данные отчёта снова доступны.' : phase[0] === 'loading' ? 'Повторный запрос выполняется. Дождитесь ответа.' : 'Временно нет связи с сервисом отчётов. Повторите запрос; выбранный период сохранён.';
    return <div className={"demo-stack"}>
    <S.DsBanner headingLevel={'h4'} tone={phase[0] === 'error' ? 'danger' : phase[0] === 'ready' ? 'success' : 'info'} announcement={'polite'} title={title} actions={<S.DsButton tone={'secondary'} size={'sm'} loading={phase[0] === 'loading'} onClick={retry}>
    {phase[0] === 'ready' ? 'Снова показать ошибку' : 'Повторить запрос'}
    </S.DsButton>}>
    {body}
    </S.DsBanner>
    <p>
    {'Попыток: ' + attempts[0]}
    </p>
    </div>;
}
function TwoActionsExample() {
    var short = React.useState(false), help = React.useState(false), helpRef = React.useRef(null), linkRef = React.useRef(null);
    React.useEffect(function () {
        if (help[0] && helpRef.current)
            helpRef.current.focus();
    }, [help[0]]);
    return <div className={"demo-stack"}>
    <S.DsBanner headingLevel={'h4'} tone={short[0] ? 'info' : 'warning'} announcement={'polite'} title={short[0] ? 'Период соответствует сроку хранения' : 'В отчёте за год будут доступны не все поездки'} actions={[
        <S.DsButton key={'period'} tone={'secondary'} size={'sm'} onClick={function () { short[1](!short[0]); }}>
        {short[0] ? 'Вернуть исходный период' : 'Выбрать 30 дней'}
        </S.DsButton>,
        <a key={'help'} className={'text-link'} href={'#storage-help'} ref={linkRef} onClick={function (event) { event.preventDefault(); help[1](true); }}>
        {'О сроке хранения данных'}
        </a>
    ]}>
    {short[0] ? 'Для отчёта выбраны последние 30 дней. Все поездки этого периода доступны.' : 'История поездок хранится 90 дней. За более ранние даты подробные маршруты уже недоступны, поэтому итоговые показатели за год будут неполными. Выберите последние 30 дней или узнайте, какие данные сохраняются дольше.'}
    </S.DsBanner>
    <div id={'storage-help'} className={'help'} hidden={!help[0]} tabIndex={-1} ref={helpRef}>
    <h4>
    {'Срок хранения данных'}
    </h4>
    <p>
    {'Подробная история поездок хранится 90 дней. Сохранённые выгрузки доступны отдельно; изменение периода не восстанавливает удалённые маршруты.'}
    </p>
    <S.DsButton tone={'ghost'} size={'sm'} onClick={function () { help[1](false); linkRef.current.focus(); }}>
    {'Закрыть пояснение'}
    </S.DsButton>
    </div>
    </div>;
}
function App() {
    var period = React.useState(false), shown = React.useState(true), restore = React.useRef(null);
    React.useEffect(function () {
        if (!shown[0] && restore.current)
            restore.current.querySelector('button').focus();
    }, [shown[0]]);
    return <LiveExamples>
    <LiveExample id={"action-title"} title={"Исправление проблемы"} description={"Действие в сообщении помогает устранить причину проблемы."}>
    <div className={"demo-stack"}>
    <p>
    {period[0] ? 'Период отчёта: последние 7 дней.' : 'Период отчёта: последний год.'}
    </p>
    {period[0] ? <S.DsBanner headingLevel={'h4'} announcement={'polite'} tone={'info'} title={'Доступны данные за весь выбранный период'}>
    {'Хранение данных — 90 дней.'}
    </S.DsBanner> : <S.DsBanner headingLevel={'h4'} announcement={'polite'} tone={'warning'} title={'Период отчёта длиннее срока хранения'} actions={<S.DsButton size={'sm'} tone={'secondary'} onClick={function () { period[1](true); }}>
    {'Выбрать последние 7 дней'}
    </S.DsButton>}>
    {'Часть данных за последний год уже недоступна. Выберите более короткий период.'}
    </S.DsBanner>}
    {period[0] ? <div className={'actions'}>
    <S.DsButton size={'sm'} tone={'ghost'} onClick={function () { period[1](false); }}>
    {'Вернуть исходный период'}
    </S.DsButton>
    </div> : null}
    </div>
    </LiveExample>
    <LiveExample id={"tones-title"} title={"Тоны сообщения"} description={"Выберите тон по смыслу сообщения: информация, успех, предупреждение или ошибка."}>
    <div className={"demo-stack"}>
    <div className={'variants'}>
    <S.DsBanner headingLevel={'h4'} tone={'info'} title={'Отчёт строится'}>
    {'Данные за неделю появятся через пару минут.'}
    </S.DsBanner>
    <S.DsBanner headingLevel={'h4'} tone={'success'} title={'Все объекты передают данные'}>
    {'В группе нет объектов с потерянной связью.'}
    </S.DsBanner>
    <S.DsBanner headingLevel={'h4'} tone={'warning'} title={'Заканчивается срок хранения'}>
    {'Выгрузите данные за прошлый месяц до 15 октября.'}
    </S.DsBanner>
    <S.DsBanner headingLevel={'h4'} tone={'danger'} title={'Не удалось загрузить данные'}>
    {'Проверьте соединение и повторите запрос.'}
    </S.DsBanner>
    <S.DsBanner headingLevel={'h4'} tone={'neutral'} title={'Доступ только для чтения'}>
    {'Для редактирования обратитесь к администратору.'}
    </S.DsBanner>
    </div>
    </div>
    </LiveExample>
    <LiveExample id={"compact-title"} title={"Компактное сообщение"} description={"Компактный вариант подходит для короткого пояснения рядом с рабочей областью."}>
    <div className={"demo-stack"}>
    <S.DsBanner headingLevel={'none'} tone={'warning'} compact={true} title={'У трёх объектов нет координат'}/>
    </div>
    </LiveExample>
    <LiveExample id={"retry-title"} title={"Повторный запрос"} description={"Повторите неудачный запрос и дождитесь результата, сохраняя контекст страницы."}>
    <RetryExample />
    </LiveExample>
    <LiveExample id={"two-actions-title"} title={"Сообщение с двумя действиями"} description={"Основное действие решает проблему, дополнительное даёт другой полезный путь."}>
    <TwoActionsExample />
    </LiveExample>
    <LiveExample id={"no-title"} title={"Без заголовка"} description={"Для короткого сообщения достаточно одного предложения без отдельного заголовка."}>
    <div className={"demo-stack"}>
    <S.DsBanner tone={'neutral'} compact={true}>
    {'Автоматическое обновление отключено. Данные обновятся после следующего запроса.'}
    </S.DsBanner>
    </div>
    </LiveExample>
    <LiveExample id={"close-title"} title={"Закрытие сообщения"} description={"Закройте сообщение после прочтения. Существенную информацию оставляйте доступной в содержимом."}>
    <div className={"demo-stack"}>
    {shown[0] ? <S.DsBanner headingLevel={'h4'} tone={'info'} title={'Плановые работы сегодня в 23:00'} closeLabel={'Скрыть сообщение о плановых работах'} onClose={function () { shown[1](false); }}>
    {'В течение 10 минут отчёты могут открываться медленнее.'}
    </S.DsBanner> : <p>
    {'Сообщение скрыто.'}
    </p>}
    <div className={'actions'} ref={restore}>
    <S.DsButton size={'sm'} tone={'secondary'} disabled={shown[0]} onClick={function () { shown[1](true); }}>
    {'Показать сообщение снова'}
    </S.DsButton>
    </div>
    </div>
    </LiveExample>
    </LiveExamples>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
