<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.header-stage{min-height:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:start}
.sep{width:1px;height:24px;background:var(--ds-divider)}
.cap{font:var(--ds-type-caption);color:var(--ds-fg-muted)}
.dark{display:inline-flex;padding:8px;border-radius:var(--ds-radius-md);background:var(--ds-brand);color:var(--ds-on-brand)}
</style></head><body data-ds-examples><div id="root"></div><script type="application/json" id="example-code-sources" data-ds-example-sources="examples.json"></script><script type="text/babel">
const S = window.AuroraWebDesignSystem_96e210;
const { LiveExamples, LiveExample } = window.DsLiveExamples;
function HeaderExample(props) {
    var t = React.useState('m');
    var message = React.useState('');
    const [compact,setCompact] = React.useState(() => matchMedia('(max-width: 600px)').matches);
    React.useEffect(() => {
        const media = matchMedia('(max-width: 600px)');
        const update = () => setCompact(media.matches);
        media.addEventListener('change',update);
        return () => media.removeEventListener('change',update);
    },[]);
    return <div className="col header-stage">
    <S.DsAppHeader product={compact ? '' : 'Aurora'} logoSrc={compact ? undefined : '../assets/logo/AuroraWhite.png'} env={compact ? undefined : 'DEV'} actions={[!compact && <S.DsIconButton key={'h'} icon={'help'} label={'Справка'} tone={'onHeader'} onClick={() => message[1]('Открыта справка.')}/>, <S.DsUserMenu key={'u'} name={'a.ivanov'} items={[{ id: 'profile', label: 'Профиль', icon: 'person' }, { id: 'settings', label: 'Настройки', icon: 'settings' }]} onSelect={item => message[1]('Выбрано: ' + item.label)}/>]}>
    <S.DsTabs tone={'onHeader'} stack={props.stack} active={t[0]} onChange={t[1]} items={[
        { id: 'm', label: 'Мониторинг', icon: 'map' }, { id: 'r', label: 'Отчёты', icon: 'assessment' },
        { id: 'n', label: 'Оповещения', icon: 'notifications', badge: 3 }
    ]}/>
    </S.DsAppHeader>
    <p role="status" aria-label="Результат выбора">{message[0] || 'Открыт раздел: ' + {m:'Мониторинг',r:'Отчёты',n:'Оповещения'}[t[0]]}</p>
    </div>;
}
function App() {
    return <LiveExamples>
    <LiveExample id={"stacked-navigation"} title={"Навигация с иконками над текстом"} description={"Переключайте разделы приложения; действия и меню пользователя находятся справа."}>
    <HeaderExample stack={true}/>
    </LiveExample>
    <LiveExample id={"inline-navigation"} title={"Навигация в одну строку"} description={"Короткие подписи позволяют расположить иконку рядом с названием раздела."}>
    <HeaderExample stack={false}/>
    </LiveExample>
    </LiveExamples>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
