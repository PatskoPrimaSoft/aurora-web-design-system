<!-- @dsCard layout="component" scopeMode="inherit" group="5 · Компоненты · обратная связь" height=1100 subtitle="Объясняет отсутствие содержимого и предлагает следующий шаг" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
.result{padding:16px;overflow-wrap:anywhere}
.result p{margin:0 0 12px}
.result:focus-visible{outline:var(--ds-focus-width) solid var(--ds-focus-color);outline-offset:var(--ds-focus-offset)}
.text-link{color:var(--ds-brand-text);text-underline-offset:3px;overflow-wrap:anywhere}
.text-link:hover{text-decoration-thickness:2px}
.caption{font:var(--ds-type-caption);color:var(--ds-fg-muted);text-align:center;margin:8px 0 0}
.caption:empty{display:none}
.narrow{width:100%;max-width:360px;margin-inline:auto}
</style></head><body data-ds-examples><div id="root"></div><script type="application/json" id="example-code-sources" data-ds-example-sources="examples.json"></script><script type="text/babel">
const S = window.AuroraWebDesignSystem_96e210;
const { LiveExamples, LiveExample } = window.DsLiveExamples;
function Example(props) {
    var done = React.useState(false), result = React.useRef(null), area = React.useRef(null), resetFocus = React.useRef(false);
    React.useEffect(function () {
        if (done[0])
            result.current.focus();
        else if (resetFocus.current) {
            area.current.querySelector('button').focus();
            resetFocus.current = false;
        }
    }, [done[0]]);
    function reset() { resetFocus.current = true; done[1](false); }
    return <div className={"demo-stack"}>
    <div ref={area} className={props.small ? 'narrow' : undefined}>
    {done[0] ? <div className={'result'} tabIndex={-1} ref={result}>
    <p>
    {props.result}
    </p>
    <S.DsButton tone={'ghost'} size={'sm'} onClick={reset}>
    {'Снова показать пустое состояние'}
    </S.DsButton>
    </div> : <S.DsEmptyState icon={props.icon} headingLevel={'h4'} title={props.title} description={props.description} tone={props.tone} size={props.small ? 'sm' : 'md'} action={<S.DsButton tone={props.primary ? 'primary' : 'secondary'} size={props.small ? 'sm' : 'md'} onClick={function () { done[1](true); }}>
    {props.action}
    </S.DsButton>}/>}
    </div>
    </div>;
}
function RetryExample() {
    var phase = React.useState('error'), attempts = React.useState(0), timer = React.useRef(null), area = React.useRef(null), result = React.useRef(null), restore = React.useRef(false);
    React.useEffect(function () { return function () { clearTimeout(timer.current); }; }, []);
    React.useEffect(function () {
        if (phase[0] === 'ready')
            result.current.focus();
        else if (restore.current) {
            area.current.querySelector('button').focus();
            restore.current = false;
        }
    }, [phase[0]]);
    function retry() {
        if (phase[0] !== 'error')
            return;
        phase[1]('loading');
        attempts[1](function (n) { return n + 1; });
        timer.current = setTimeout(function () { phase[1]('ready'); }, 1200);
    }
    function reset() { restore.current = true; phase[1]('error'); attempts[1](0); }
    return <div className={"demo-stack"}>
    <div className={'narrow'} ref={area}>
    {phase[0] === 'ready' ? <div className={'result'} tabIndex={-1} ref={result}>
    <p>
    {'Соединение восстановлено. Объекты загружены.'}
    </p>
    <S.DsButton tone={'ghost'} size={'sm'} onClick={reset}>
    {'Снова показать пустое состояние'}
    </S.DsButton>
    </div> : <S.DsEmptyState headingLevel={'h4'} icon={'cloud_off'} tone={'danger'} size={'sm'} title={'Не удалось загрузить объекты'} description={'Нет связи с сервисом. Повторите запрос.'} action={<S.DsButton tone={'secondary'} size={'sm'} loading={phase[0] === 'loading'} onClick={retry}>
    {'Повторить запрос'}
    </S.DsButton>}/>}
    <p className={'caption'} role={'status'}>
    {phase[0] === 'loading' ? 'Повторный запрос выполняется. Дождитесь ответа.' : ''}
    </p>
    <p className={'caption'}>
    {'Попыток: ' + attempts[0]}
    </p>
    </div>
    </div>;
}
function TwoActions() {
    var help = React.useState(false), result = React.useState(false), area = React.useRef(null), link = React.useRef(null);
    React.useEffect(function () {
        if (help[0])
            area.current.focus();
    }, [help[0]]);
    return <div className={"demo-stack"}>
    <div className={'narrow'}>
    <S.DsEmptyState icon={null} headingLevel={'h4'} announcement={'polite'} title={result[0] ? 'Период изменён' : 'За выбранный период нет маршрутов'} description={result[0] ? 'Выбраны последние 7 дней. Найдено 3 маршрута.' : 'Маршруты хранятся 90 дней. Выберите более короткий период или прочитайте, как работает хранение данных.'} action={<S.DsButton tone={'primary'} onClick={function () { result[1](!result[0]); }}>
    {result[0] ? 'Вернуть исходный период' : 'Выбрать последние 7 дней'}
    </S.DsButton>} secondary={<a ref={link} href={'#retention-help'} className={'text-link'} onClick={function (e) { e.preventDefault(); help[1](true); }}>
    {'О хранении маршрутов'}
    </a>}/>
    </div>
    <div id={'retention-help'} ref={area} tabIndex={-1} className={'result'} hidden={!help[0] && !result[0]}>
    <p>
    {help[0] ? 'Маршруты старше 90 дней удаляются. Экспортируйте нужные данные до окончания срока хранения.' : 'Три маршрута доступны для просмотра.'}
    </p>
    {help[0] ? <S.DsButton tone={'ghost'} size={'sm'} onClick={function () { help[1](false); link.current.focus(); }}>
    {'Закрыть пояснение'}
    </S.DsButton> : null}
    </div>
    </div>;
}
function App() {
    return <LiveExamples>
    <LiveExample id={"filtered"} title={"Ничего не найдено"} description={"Если фильтры скрыли все объекты, предложите сбросить условия и вернуть содержимое."}>
    <Example id={'filtered'} heading={'Ничего не найдено'} icon={'filter_alt'} title={'Нет объектов по заданным фильтрам'} description={'Попробуйте изменить условия или сбросьте фильтры.'} action={'Сбросить фильтры'} result={'Фильтры сброшены. Найдено 12 объектов.'}/>
    </LiveExample>
    <LiveExample id={"first"} title={"Первый объект"} description={"Пустой раздел объясняет следующий шаг и предлагает добавить первый объект."}>
    <Example id={'first'} heading={'Первый объект'} primary={true} icon={'add_location_alt'} tone={'info'} title={'Объектов пока нет'} description={'Добавьте первый объект, чтобы видеть его положение на карте.'} action={'Добавить объект'} result={'Объект «Автомобиль 01» добавлен.'}/>
    </LiveExample>
    <LiveExample id={"retry"} title={"Ошибка загрузки · компактный вариант"} description={"Повторите запрос после ошибки: пример показывает ожидание и переход к загруженным данным."}>
    <RetryExample />
    </LiveExample>
    <LiveExample id={"two-actions"} title={"Без иконки · два действия"} description={"Текст объясняет отсутствие данных, а действия предлагают изменить условия или прочитать пояснение."}>
    <TwoActions />
    </LiveExample>
    <LiveExample id={"no-action"} title={"Без доступного действия"} description={"Если пользователь не может исправить ситуацию сам, объясните, к кому обратиться."}>
    <div className={"demo-stack"}>
    <S.DsEmptyState headingLevel={'h4'} icon={'lock'} tone={'warning'} title={'Нет доступа к отчётам'} description={'Попросите администратора предоставить доступ к этому разделу.'}/>
    </div>
    </LiveExample>
    </LiveExamples>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
