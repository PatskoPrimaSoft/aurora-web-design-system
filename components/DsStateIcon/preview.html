<!-- @dsCard layout="component" scopeMode="inherit" aliases="состояние объекта|статус объекта|state icon" group="5 · Компоненты · данные" height=800 subtitle="Состояние объекта по значку и цвету; направление движения — по курсу" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.states{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.state{display:flex;align-items:center;gap:8px;min-height:28px}
.cap{font:var(--ds-type-caption);color:var(--ds-fg-muted);margin:0}
.control{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
select{font:var(--ds-type-ui);color:var(--ds-fg);background:var(--ds-surface);border:1px solid var(--ds-border-field);border-radius:var(--ds-radius-xs);height:var(--ds-control-h-sm);max-width:100%;padding:0 8px}
select:focus-visible{outline:var(--ds-focus-width) solid var(--ds-focus-color);outline-offset:var(--ds-focus-offset)}
</style></head><body data-ds-examples><div id="root"></div><script type="application/json" id="example-code-sources" data-ds-example-sources="examples.json"></script><script type="text/babel">
const S = window.AuroraWebDesignSystem_96e210;
const { LiveExamples, LiveExample } = window.DsLiveExamples;
var states = Object.keys(S.dsFleetState);
function App() {
    var state = React.useState('moving'), course = React.useState(45), active = React.useState(null);
    return <LiveExamples>
    <LiveExample id={"sostoyanie-i-kurs"} title={"Состояние и курс"} description={"Измените состояние и направление движения объекта."}>
    <div className={"demo-stack"}>
    <div className={'control'}>
    <label htmlFor={'object-state'}>
    {'Состояние'}
    </label>
    <select id={'object-state'} value={state[0]} onChange={function (e) { state[1](e.target.value); }}>
    {states.map(function (key) { return <option key={key} value={key}>
    {S.dsFleetState[key].label}
    </option>; })}
    </select>
    </div>
    <div className={'row'}>
    <div className={'state'} aria-live={'polite'} aria-atomic={'true'}>
    <S.DsStateIcon state={state[0]} course={course[0]} label={S.dsFleetState[state[0]].label + (state[0] === 'moving' ? ', курс ' + course[0] + '°' : '')}/>
    <span>
    {S.dsFleetState[state[0]].label}
    </span>
    </div>
    <S.DsButton size={'sm'} tone={'secondary'} disabled={state[0] !== 'moving'} onClick={function () { course[1]((course[0] + 45) % 360); }}>
    {'Повернуть на 45°'}
    </S.DsButton>
    </div>
    <p className={'cap'}>
    {'Курс: ' + course[0] + '°. Поворот применяется только в движении; 0° — север.'}
    </p>
    </div>
    </LiveExample>
    <LiveExample id={"sostoyaniya-obektov"} title={"Состояния объектов"} description={"Значок и цвет совместно показывают состояние; подпись остаётся доступной без различения цветов."}>
    <div className={"demo-stack"}>
    <div className={'states'}>
    {states.map(function (key) {
        return <div key={key} className={'state'}>
        <S.DsStateIcon state={key} course={key === 'moving' ? 45 : undefined} decorative={true}/>
        <span>
        {S.dsFleetState[key].label}
        </span>
        </div>;
    })}
    </div>
    </div>
    </LiveExample>
    <LiveExample id={"razmery"} title={"Размеры"} description={"Сравните доступные размеры. Для связанных элементов используйте одинаковый размер."}>
    <div className={"demo-stack"}>
    <div className={'row'}>
    {[20, 28, 36].map(function (size) { return <div key={size} className={'state'}>
    <S.DsStateIcon state={'moving'} course={45} size={size}/>
    <span className={'cap'}>
    {size + ' px'}
    </span>
    </div>; })}
    </div>
    </div>
    </LiveExample>
    <LiveExample id={"v-spiske-obektov"} title={"В списке объектов"} description={"Статус дополняет подпись строки и помогает просматривать несколько объектов."}>
    <div className={"demo-stack"}>
    {[{ id: 'car-1', title: 'Грузовик 01', state: 'moving', subtitle: 'Северный проезд', value: '64 км/ч' },
        { id: 'car-2', title: 'Фургон 02', state: 'parked', subtitle: 'Склад № 2', value: '0 км/ч' },
        { id: 'car-3', title: 'Грузовик 03', state: 'offline', subtitle: 'Последняя связь 12 минут назад' }].map(function (item) {
        return <S.DsListRow key={item.id} title={item.title} subtitle={item.subtitle} state={item.state} course={45} value={item.value} active={active[0] === item.id} onClick={function () { active[1](item.id); }}/>;
    })}
    </div>
    </LiveExample>
    <LiveExample id={"bez-diska"} title={"Без диска"} description={"Вариант без фонового диска подходит для компактного размещения рядом с текстом."}>
    <div className={"demo-stack"}>
    <div className={'states'}>
    {states.map(function (key) {
        return <div key={key} className={'state'}>
        <S.DsStateIcon state={key} course={key === 'moving' ? 45 : undefined} bare={true} decorative={true}/>
        <span>
        {S.dsFleetState[key].label}
        </span>
        </div>;
    })}
    </div>
    </div>
    </LiveExample>
    </LiveExamples>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
