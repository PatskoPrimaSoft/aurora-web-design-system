<!-- @dsCard layout="component" scopeMode="inherit" group="5 · Компоненты · данные" height=900 subtitle="Строка иерархии с раскрытием, групповым выбором и счётчиком" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
.tree{max-width:560px;min-width:0}
.leaves{padding-left:40px}
.leaf{display:flex;align-items:center;gap:var(--ds-gap-sm);min-width:0}
.leaf>span{flex:1;min-width:0}
.cap{font:var(--ds-type-caption);color:var(--ds-fg-muted);margin:0}
</style></head><body data-ds-examples><div id="root"></div><script type="application/json" id="example-code-sources" data-ds-example-sources="examples.json"></script><script type="text/babel">
const S = window.AuroraWebDesignSystem_96e210;
const { LiveExamples, LiveExample } = window.DsLiveExamples;
var groups = [{ id: 'trucks', title: 'Грузовики', objects: ['MAZ 5440', 'Volvo FH16'] }, { id: 'vans', title: 'Фургоны', objects: ['GAZ Next'] }];
var ids = ['MAZ 5440', 'Volvo FH16', 'GAZ Next'];
function selection(items, chosen) { var n = items.filter(function (id) { return chosen.includes(id); }).length; return n === 0 ? 'unchecked' : n === items.length ? 'checked' : 'indeterminate'; }
function TreeExample() {
    var open = React.useState({ user: true, trucks: true, vans: false }), chosen = React.useState(['Volvo FH16']);
    function toggle(id, next) { open[1](function (prev) { return Object.assign({}, prev, { [id]: next }); }); }
    function choose(items, next) { chosen[1](function (prev) { var rest = prev.filter(function (id) { return !items.includes(id); }); return next === 'checked' ? rest.concat(items) : rest; }); }
    return <div className={"demo-stack"}>
    <div className={'tree'}>
    <S.DsTreeRow title={'Петров Сергей'} avatar={true} expanded={open[0].user} onToggle={function (next) { toggle('user', next); }} selected={chosen[0].length} total={ids.length} select={selection(ids, chosen[0])} onSelectChange={function (next) { choose(ids, next); }} unread={2}/>
    {open[0].user ? groups.map(function (group) {
        return <React.Fragment key={group.id}>
        <S.DsTreeRow title={group.title} icon={'label'} level={1} expanded={open[0][group.id]} onToggle={function (next) { toggle(group.id, next); }} selected={group.objects.filter(function (id) { return chosen[0].includes(id); }).length} total={group.objects.length} select={selection(group.objects, chosen[0])} onSelectChange={function (next) { choose(group.objects, next); }}/>
        {open[0][group.id] ? <div className={'leaves'}>
        {group.objects.map(function (id) { return <div className={'leaf'} key={id}>
        <span>
        {id}
        </span>
        <S.DsCheckbox state={chosen[0].includes(id) ? 'checked' : 'unchecked'} ariaLabel={'Выбрать: ' + id} onChange={function (next) { choose([id], next); }}/>
        </div>; })}
        </div> : null}
        </React.Fragment>;
    }) : null}
    </div>
    <p className={'cap'} role={'status'}>
    {'Выбрано объектов: ' + chosen[0].length + ' из ' + ids.length}
    </p>
    <p className={'cap'}>
    {'Выбор группы меняет выбор её объектов. Сворачивание сохраняет выбор.'}
    </p>
    </div>;
}
function ActionsExample() {
    var open = React.useState(true), view = React.useState(false), choice = React.useState('unchecked');
    return <div className={"demo-stack"}>
    <div className={'tree'}>
    <S.DsTreeRow title={'Северный филиал'} icon={'label'} expanded={open[0]} onToggle={open[1]} active={view[0]} onClick={function () { view[1](!view[0]); }} total={2} selected={choice[0] === 'checked' ? 2 : 0} select={choice[0]} onSelectChange={choice[1]}/>
    {open[0] ? <div className={'leaves'}>
    <S.DsListRow title={'MAZ 5440'} subtitle={'AB 1234-7'}/>
    <S.DsListRow title={'Volvo FH16'} subtitle={'AC 8871-2'}/>
    </div> : null}
    </div>
    <p className={'cap'} role={'status'}>
    {view[0] ? 'Открыта группа «Северный филиал».' : 'Группа ещё не открыта.'}
    </p>
    <p className={'cap'}>
    {'Шеврон раскрывает ветку, название включает и снимает просмотр, чекбокс выбирает объекты. Действия независимы.'}
    </p>
    </div>;
}
function StatesExample() {
    return <div className={"demo-stack"}>
    <div className={'tree'}>
    <S.DsTreeRow title={'Иванова Анна'} avatar={true} expanded={false} unread={120}/>
    <S.DsTreeRow title={'Группа без объектов'} icon={'label'} level={1} expanded={false} total={0} selected={0} select={'unchecked'} selectDisabled={true}/>
    <S.DsTreeRow title={'Архив'} icon={'label'} level={1} expanded={false} meta={'только чтение'}/>
    </div>
    <p className={'cap'}>
    {'Инициалы, счётчик непрочитанных 99+, недоступный выбор и дополнительная подпись.'}
    </p>
    </div>;
}
function LongTitleExample() {
    var open = React.useState(false);
    return <div className={"demo-stack"}>
    <div className={'tree'} style={{ maxWidth: 320 }}>
    <S.DsTreeRow title={'Группа транспорта северо-западного подразделения'} icon={'label'} meta={'Северо-западное подразделение · только чтение'} expanded={open[0]} onToggle={open[1]} total={12} selected={0} select={'unchecked'} selectDisabled={true}/>
    {open[0] ? <p className={'cap'} role={'status'}>
    {'Ветка раскрыта.'}
    </p> : null}
    </div>
    <p className={'cap'}>
    {'Наведите указатель или перейдите к строке клавишей Tab: подсказка покажет полное название. Escape закрывает её.'}
    </p>
    </div>;
}
function App() { return <LiveExamples>
<LiveExample id={"ierarhiya-i-gruppovoy-vybor"} title={"Иерархия и групповой выбор"} description={"Раскрывайте группы и выбирайте объекты; частичный выбор группы следует дочерним строкам."}>
<TreeExample />
</LiveExample>
<LiveExample id={"raskrytie-i-otkrytie-gruppy"} title={"Раскрытие и открытие группы"} description={"Отдельное действие раскрывает иерархию, а строка открывает выбранную группу."}>
<ActionsExample />
</LiveExample>
<LiveExample id={"varianty-stroki"} title={"Варианты строки"} description={"Сравните содержимое, счётчики и доступные действия иерархической строки."}>
<StatesExample />
</LiveExample>
<LiveExample id={"dlinnoe-nazvanie"} title={"Длинное название"} description={"Длинная подпись помещается в строку, сохраняя полный смысл доступного имени."}>
<LongTitleExample />
</LiveExample>
</LiveExamples>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
