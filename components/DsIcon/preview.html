<!-- @dsCard layout="component" scopeMode="inherit" group="5 · Компоненты · примитивы" height=1000 subtitle="Иконка Material Symbols Outlined; размер, направление и доступное имя" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.sample{display:flex;align-items:center;gap:8px}
.cap{font:var(--ds-type-caption);color:var(--ds-fg-muted);margin:0}
.surface{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:12px;border-radius:var(--ds-radius-sm)}
.brand{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--ds-radius-sm);background:var(--ds-brand);color:var(--ds-on-brand)}
</style></head><body data-ds-examples><div id="root"></div><script type="application/json" id="example-code-sources" data-ds-example-sources="examples.json"></script><script type="text/babel">
const S = window.AuroraWebDesignSystem_96e210;
const { LiveExamples, LiveExample } = window.DsLiveExamples;
function App() {
    var course = React.useState(45), chosen = React.useState('search'), saved = React.useState(false);
    var icons = [['search', 'Поиск'], ['delete', 'Удаление'], ['local_shipping', 'Транспорт'], ['navigation', 'Направление'], ['lock', 'Ограниченный доступ'], ['straighten', 'Измерение']];
    return <LiveExamples>
    <LiveExample id={"ikonka-v-knopke"} title={"Иконка в кнопке"} description={"Иконка дополняет действие кнопки; её название задаётся самой кнопкой."}>
    <div className={"demo-stack"}>
    <div className={'row'}>
    <S.DsIcon name={'bookmark'} label={'Закладка'} size={'sm'}/>
    <S.DsIconButton icon={'bookmark'} label={'Сохранить в избранное'} active={saved[0]} onClick={function () { saved[1](!saved[0]); }}/>
    <span role={'status'}>
    {saved[0] ? 'Сохранено в избранном' : 'Не сохранено'}
    </span>
    </div>
    <p className={'cap'}>
    {'Символ и область нажатия имеют разные размеры. Tab переводит фокус на кнопку; Enter и пробел переключают выбор.'}
    </p>
    </div>
    </LiveExample>
    <LiveExample id={"razmery"} title={"Размеры"} description={"Сравните доступные размеры. Для связанных элементов используйте одинаковый размер."}>
    <div className={"demo-stack"}>
    <div className={'row'}>
    {['xs', 'sm', 'md', 'lg'].map(function (size) {
        return <div key={size} className={'sample'}>
        <S.DsIcon name={'local_shipping'} size={size}/>
        <span className={'cap'}>
        {size}
        </span>
        </div>;
    })}
    </div>
    <div className={'row'}>
    {['expand_more', 'search', 'local_shipping'].map(function (name) { return <span key={name} className={'sample'}>
    <S.DsIcon name={name} size={'xs'}/>
    <S.DsIcon name={name} size={'md'}/>
    <span className={'cap'}>
    {name}
    </span>
    </span>; })}
    </div>
    <p className={'cap'}>
    {'xs — для шевронов и вспомогательных символов. Для значимых подробных иконок предпочитайте md.'}
    </p>
    </div>
    </LiveExample>
    <LiveExample id={"napravlenie"} title={"Направление"} description={"Поворачивайте навигационную иконку: значение rotate показывает курс объекта."}>
    <div className={"demo-stack"}>
    <div className={'row'}>
    <div className={'sample'}>
    <S.DsIcon name={'navigation'} rotate={course[0]}/>
    <span>
    {'Курс: ' + course[0] + '°'}
    </span>
    </div>
    <S.DsButton size={'sm'} tone={'secondary'} onClick={function () { course[1]((course[0] + 45) % 360); }}>
    {'Повернуть на 45°'}
    </S.DsButton>
    </div>
    <p className={'cap'}>
    {'0° — север. Поворот передаёт направление движения.'}
    </p>
    </div>
    </LiveExample>
    <LiveExample id={"tsvet-i-dostupnoe-imya"} title={"Цвет и доступное имя"} description={"Цвет следует токенам, а смысловая иконка получает понятное доступное имя."}>
    <div className={"demo-stack"}>
    <div className={'row'}>
    <span className={'sample'}>
    <S.DsIcon name={'local_shipping'}/>
    {'Транспорт'}
    </span>
    <span className={'brand'}>
    <S.DsIcon name={'done'}/>
    {'Сохранено'}
    </span>
    <S.DsIcon name={'lock'} label={'Доступ ограничен'}/>
    </div>
    <p className={'cap'}>
    {'Рядом с текстом иконка декоративная. Отдельный замок имеет доступное имя «Доступ ограничен». Цвет наследуется от родителя.'}
    </p>
    </div>
    </LiveExample>
    <LiveExample id={"status-na-raznyh-poverhnostyah"} title={"Статусные цвета"} description={"Цвет и символ помогают различать информационные сообщения, успех, предупреждение и ошибку."}>
    <div className={"demo-stack"}>
    <div className={'surface'} data-icon-surface={'normal'}>
        {[['info', 'info', 'Информация'], ['success', 'check_circle', 'Успешно'], ['warning', 'warning', 'Предупреждение'], ['danger', 'error', 'Ошибка']].map(function (item) { return <span key={item[0]} className={'sample'} style={{ color: 'var(--ds-' + item[0] + '-fg)' }}>
        <S.DsIcon name={item[1]}/>
        <span>
        {item[2]}
        </span>
        </span>; })}
    </div>
    </div>
    </LiveExample>
    <LiveExample id={"vybor-ikonki"} title={"Выбор иконки"} description={"Выберите символ и посмотрите результат в демонстрационной области."}>
    <div className={"demo-stack"}>
    <div className={'row'}>
    {icons.map(function (item) { return <S.DsButton key={item[0]} tone={chosen[0] === item[0] ? 'primary' : 'secondary'} size={'sm'} icon={item[0]} aria-pressed={chosen[0] === item[0]} onClick={function () { chosen[1](item[0]); }}>
    {item[1]}
    </S.DsButton>; })}
    </div>
    <div className={'sample'}>
    <S.DsIcon name={chosen[0]} size={'lg'}/>
    <code>
    {chosen[0]}
    </code>
    </div>
    <p className={'cap'}>
    {'Один смысл — один узнаваемый символ. Не добавляйте иконку, если она не помогает понять действие.'}
    </p>
    </div>
    </LiveExample>
    <LiveExample id={"vyravnivanie"} title={"Выравнивание"} description={"Сравните выравнивание иконок рядом с текстом разных ролей."}>
    <div className={"demo-stack"}>
    <div className={'row'}>
    {icons.map(function (item) { return <span key={item[0]} className={'sample'}>
    <S.DsIcon name={item[0]}/>
    {item[1]}
    </span>; })}
    </div>
    <div className={'row'}>
    {[0, 90, 180, 270].map(function (angle) { return <span key={angle} className={'sample'}>
    <S.DsIcon name={'navigation'} rotate={angle}/>
    {angle + '°'}
    </span>; })}
    </div>
    <p className={'cap'}>
    {'Иконки центрируются в области своего размера; расстояние до текста задаёт родитель.'}
    </p>
    </div>
    </LiveExample>
    </LiveExamples>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
