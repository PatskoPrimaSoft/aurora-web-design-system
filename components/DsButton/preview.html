<!-- @dsCard group="5 · Компоненты · кнопки" height=150 subtitle="Один компонент, шесть тонов, три размера из токенов плотности" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
html,body{margin:0}*{box-sizing:border-box}
body{font:var(--ds-type-body);color:var(--ds-fg);background:var(--ds-bg);padding:16px;-webkit-font-smoothing:antialiased}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:start}
.sep{width:1px;height:24px;background:var(--ds-divider)}
.cap{font:var(--ds-type-caption);color:var(--ds-fg-muted)}
.dark{display:inline-flex;padding:8px;border-radius:var(--ds-radius-md);background:var(--ds-brand);color:var(--ds-on-brand)}
</style></head><body><div id="root"></div><script>
(function(){var h=React.createElement,S=window.AuroraWebDesignSystem_96e210;
function App(){return h('div',{className:'col'},
  h('div',{className:'row'},['primary','secondary','subtle','ghost','danger','accent'].map(function(t){
    return h(S.DsButton,{key:t,tone:t},t==='danger'?'Переместить в архив':t==='primary'?'Сохранить':t==='accent'?'Новое':'Отмена');})),
  h('div',{className:'row'},
    h(S.DsButton,{size:'sm',icon:'download',tone:'secondary'},'Экспорт CSV'),
    h(S.DsButton,{icon:'add'},'Добавить объект'),
    h(S.DsButton,{size:'lg',iconRight:'expand_more',tone:'secondary'},'Фильтры'),
    h(S.DsButton,{loading:true},'Сохранить'),
    h(S.DsButton,{disabled:true},'Сохранить')));}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));})();
</script></body></html>
