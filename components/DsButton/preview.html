<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
html,body{margin:0}*{box-sizing:border-box}
body{font:var(--ds-type-body);color:var(--ds-fg);background:var(--ds-surface);padding:16px;-webkit-font-smoothing:antialiased}
.examples{display:flex;flex-direction:column;gap:32px}

.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sample{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0;max-width:100%}

</style></head><body><div id="root"></div><script>
(function(){var h=React.createElement,S=window.AuroraWebDesignSystem_96e210;
function section(title,content){return h('section',{className:'section','aria-label':title},h('h3',null,title),content);}

    h(S.DsField,{label:'Название объекта',required:true,value:name[0],error:error[0],onChange:function(e){name[1](e.target.value);if(error[0])error[1]('');}}),
    h('div',{className:'row actions'},h(S.DsButton,{tone:'secondary',onClick:cancel},'Отмена'),h(S.DsButton,{type:'submit'},'Сохранить')),
    h('p',{className:'cap',role:'status'},message[0])));

function DeletePair(){
  var deleted=React.useState(false),message=React.useState('Удалить объект «Volvo FH16» из примера?');
  return section('Удаление и отмена',h('div',{className:'form'},
    h('p',{className:'cap',role:'status'},message[0]),
    h('div',{className:'row actions'},
      deleted[0]?null:h(S.DsButton,{key:'cancel',tone:'secondary',onClick:function(){message[1]('Удаление отменено. Объект сохранён.');}},'Отмена'),

function App(){

    section('На инверсной поверхности',h('div',{style:{background:'var(--ds-surface-inverse)',padding:12,borderRadius:'var(--ds-radius-md)',alignSelf:'flex-start'}},h(S.DsButton,{tone:'inverse',onClick:function(){report('Отменить');}},'Отменить'))),
    section('Тоны',h('div',{className:'row'},[

    section('Размеры и иконки',h('div',{className:'row'},
      h('div',{className:'sample'},h(S.DsButton,{size:'sm',tone:'secondary',icon:'download',onClick:function(){report('Экспорт CSV');}},'Экспорт CSV'),h('span',{className:'cap'},'sm · иконка слева')),
      h('div',{className:'sample'},h(S.DsButton,{icon:'add',onClick:function(){report('Добавить объект');}},'Добавить объект'),h('span',{className:'cap'},'md · по умолчанию')),
      h('div',{className:'sample'},h(S.DsButton,{size:'lg',tone:'secondary',iconRight:'arrow_forward',onClick:function(){report('Продолжить');}},'Продолжить'),h('span',{className:'cap'},'lg · иконка справа')))),
    section('Недоступное действие',h('div',{className:'row'},['primary','secondary','subtle','ghost','danger','accent'].map(function(tone){return h('div',{className:'sample',key:tone},h(S.DsButton,{tone:tone,disabled:true},tone==='danger'?'Удалить':'Сохранить'),h('span',{className:'cap'},tone));}))),
    h('p',{className:'cap',role:'status','aria-label':'Результат действия'},action[0]),
    section('Сохранение с загрузкой',h('div',{className:'form'},
      h('p',{className:'cap'},'Цвет, ширина и фокус сохраняются. Повторное нажатие недоступно.'),
      h('div',null,h(S.DsButton,{icon:'save',loading:saving[0],onClick:save},'Сохранить изменения')),
      h(S.DsButton,{tone:'secondary',fullWidth:true,icon:'save',loading:saving[0],onClick:save},'Сохранить изменения'),
      h('p',{className:'cap',role:'status','aria-label':'Результат сохранения'},saving[0]?'Сохраняем изменения…':saved[0]?'Изменения сохранены.':'Изменения ещё не сохранены.'))),
    section('Длинная подпись',h('div',{className:'form'},
      h('div',{style:{width:wide[0]?'100%':200,maxWidth:'100%',display:'flex'}},h(S.DsButton,{tone:'secondary',icon:'download',iconRight:'arrow_forward',fullWidth:true,onClick:function(){report('Скачать отчёт по выбранным объектам');}},'Скачать отчёт по выбранным объектам')),
      h('div',null,h(S.DsButton,{tone:'ghost',size:'sm',onClick:function(){wide[1](!wide[0]);}},wide[0]?'Сузить область':'Расширить область')))),
    h(SavePair),h(DeletePair),
    section('Причина недоступности',h('div',{className:'form'},
      h('div',null,h(S.DsButton,{tone:'secondary',disabled:true,'aria-describedby':'export-reason'},'Экспорт')),
      h('p',{id:'export-reason',className:'cap'},'Экспорт доступен администратору. Обратитесь к администратору проекта.'))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));})();
</script></body></html>
