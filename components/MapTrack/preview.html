const MPP=12,W=688,H=300,LAT=53.9;
const BX=(Math.min(...T.map(p=>p[0]))+Math.max(...T.map(p=>p[0])))/2,BY=(Math.min(...T.map(p=>p[1]))+Math.max(...T.map(p=>p[1])))/2,FOCUS=T[20];
const el=id=>document.getElementById(id);
function draw(z){
  const res=156543.034*Math.cos(LAT*Math.PI/180)/Math.pow(2,z),sc=MPP/res;
  const t=Math.min(1,Math.max(0,(z-11.5)/1.5)),cx=BX+(FOCUS[0]-BX)*t,cy=BY+(FOCUS[1]-BY)*t;
  const P=T.map(([x,y])=>[(x-cx)*sc+W/2,(y-cy)*sc+H/2]);
  el('line').setAttribute('d','M'+P.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L'));
  const interval=Math.max(100,res*80),step=interval/res;
  let acc=step/2,out='',n=0;
  for(let i=1;i<P.length;i++){
    const dx=P[i][0]-P[i-1][0],dy=P[i][1]-P[i-1][1],len=Math.hypot(dx,dy);
    let d=acc;
    while(d<=len){
      const x=P[i-1][0]+dx*d/len,y=P[i-1][1]+dy*d/len;
      if(x>-10&&x<W+10&&y>-10&&y<H+10){out+='<path d="M0 -7L4.8 5.2L-4.8 5.2Z" fill="#386DAC" stroke="#fff" stroke-width="1" transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+(Math.atan2(dy,dx)*180/Math.PI+90).toFixed(1)+')"></path>';n++;}
      d+=step;
    }
    acc=d-len;
  }
  el('arrows').innerHTML=out;
  const pin=(p,src)=>'<img src="'+DS_ASSET[src]+'" alt="" style="left:'+(p[0]/W*100).toFixed(2)+'%;top:'+(p[1]/H*100).toFixed(2)+'%">';
  el('pins').innerHTML=pin(P[0],'start-track-marker.svg')+pin(P[P.length-1],'finish-track-marker.svg');
  el('zl').textContent='z '+z.toFixed(2);
  el('r1').textContent=res.toFixed(2)+' м/px';
  el('r2').textContent=Math.round(interval)+' м'+(interval<=100.01?' (предел)':'');
  el('r3').textContent=Math.round(step)+' px';
  el('r4').textContent=n;
}
