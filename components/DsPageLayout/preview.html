<!-- @dsCard layout="component" group="5 · Компоненты · раскладка" height=540 subtitle="Каркас страницы с шапкой, основным содержимым и необязательными боковыми регионами" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
html,body{margin:0}*{box-sizing:border-box}
body{font:var(--ds-type-body);color:var(--ds-fg);background:var(--ds-surface);padding:16px;-webkit-font-smoothing:antialiased}
.examples,section{display:flex;flex-direction:column;gap:12px}
h3,p{margin:0}h3{font:var(--ds-type-body);font-weight:var(--ds-weight-medium)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cap{font:var(--ds-type-caption);color:var(--ds-fg-muted)}
.stage{border:1px solid var(--ds-border);min-width:0}
.region{padding:12px;background:var(--ds-surface);overflow-wrap:anywhere}
.region.side{flex:1}
.region.content{min-height:180px;flex:1}
.region.header,.region.footer{background:var(--ds-bg)}
.region.header{border-bottom:1px solid var(--ds-border)}
.region.footer{border-top:1px solid var(--ds-border)}
</style></head><body><div id="root"></div><script>
(function(){var h=React.createElement,S=window.AuroraWebDesignSystem_96e210;
function region(text,kind){return h('div',{className:'region '+kind},text)}
function App(){var mode=React.useState('left'),gap=React.useState(true),footer=React.useState(false);
var choices=[['main','Основной'],['left','Слева'],['right','Справа'],['both','С двух сторон']];
return h('div',{className:'examples'},h('section',null,
 h('h3',null,'Регионы страницы'),
 h('div',{className:'row',role:'group','aria-label':'Расположение боковых регионов'},choices.map(function(item){return h(S.DsButton,{key:item[0],tone:mode[0]===item[0]?'primary':'secondary','aria-pressed':mode[0]===item[0],onClick:function(){mode[1](item[0])}},item[1])})),
 h('div',{className:'row'},
  h(S.DsButton,{tone:'secondary','aria-pressed':!gap[0],onClick:function(){gap[1](!gap[0])}},'Без отступов'),
  h(S.DsButton,{tone:'secondary','aria-pressed':footer[0],onClick:function(){footer[1](!footer[0])}},'Нижний регион')),
 h('div',{className:'stage'},h(S.DsPageLayout,{
  header:region('Шапка приложения','header'),pageHeader:region('Заголовок страницы','heading'),
  left:mode[0]==='left'||mode[0]==='both'?region('Левый регион','side'):undefined,
  right:mode[0]==='right'||mode[0]==='both'?region('Правый регион','side'):undefined,
  leftWidth:'clamp(80px, 20vw, 180px)',rightWidth:'clamp(80px, 20vw, 180px)',gap:gap[0],
  footer:footer[0]?region('Нижний регион','footer'):undefined
 },region('Основное содержимое','content'))),
 h('p',{className:'cap'},'В примере боковые регионы сужаются вместе с экраном: их ширина явно задана через leftWidth и rightWidth.')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));})();
</script></body></html>
