<!-- @dsCard layout="component" group="5 · Компоненты · данные" height=440 subtitle="Компактная метка статуса или значимого атрибута объекта" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><style>
html,body{margin:0}*{box-sizing:border-box}
body{font:var(--ds-type-body);color:var(--ds-fg);background:var(--ds-surface);padding:16px;-webkit-font-smoothing:antialiased}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:start}
.grid>*{min-width:0}
h3{font:var(--ds-type-body);font-weight:var(--ds-weight-medium);margin:0}
.section{display:flex;flex-direction:column;gap:16px}
.examples{display:flex;flex-direction:column;gap:32px}
.result{min-height:56px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px;border:1px solid var(--ds-border);border-radius:var(--ds-radius-container)}
.sep{width:1px;height:24px;background:var(--ds-divider)}
.cap{font:var(--ds-type-caption);color:var(--ds-fg-muted)}
.dark{display:inline-flex;padding:8px;border-radius:var(--ds-radius-md);background:var(--ds-brand);color:var(--ds-on-brand)}
</style></head><body><div id="root"></div><script>
(function(){var h=React.createElement,S=window.AuroraWebDesignSystem_96e210;
function App(){var T=[['neutral','Стоянка'],['info','Некорректные'],['success','Движение'],['warning','Тревога'],['danger','Нет связи']],
  tone=React.useState('success'),size=React.useState('md'),solid=React.useState(false),dot=React.useState(true),icon=React.useState(false),text=React.useState('Движение');
  return h('div',{className:'examples'},
    h('section',{className:'section','aria-label':'Настройка метки'},

        h(S.DsField,{id:'lozenge-tone',label:'Тон',as:'select',value:tone[0],options:[{value:'neutral',label:'Нейтральный'},{value:'info',label:'Информация'},{value:'success',label:'Успех'},{value:'warning',label:'Предупреждение'},{value:'danger',label:'Ошибка'}],onChange:function(e){tone[1](e.target.value);},width:'100%'}),
        h(S.DsField,{id:'lozenge-size',label:'Размер',as:'select',value:size[0],options:[{value:'sm',label:'Маленький — sm'},{value:'md',label:'Обычный — md'}],onChange:function(e){size[1](e.target.value);},width:'100%'})),
      h('div',{className:'row'},
        h(S.DsSwitch,{label:'Сплошная заливка',checked:solid[0],onChange:function(e){solid[1](e.target.checked);}}),
        h(S.DsSwitch,{label:'Точка',checked:dot[0],onChange:function(e){dot[1](e.target.checked);}}),
