<!-- @dsCard name="Цвета статусов" group="2 · Основы" height=220 subtitle="Семантика статусов, роли цветов и применение на разных поверхностях" page -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Цвета статусов</title><style>html,body{margin:0}body{font:var(--ds-type-body);color:var(--ds-fg);background:var(--ds-surface);padding:20px;box-sizing:border-box;-webkit-font-smoothing:antialiased}
.eb{font:var(--ds-type-eyebrow);letter-spacing:var(--ds-tracking-eyebrow);text-transform:uppercase;color:var(--ds-fg-subtle)}
.mono{font:var(--ds-type-mono);color:var(--ds-fg-muted)}
a{color:var(--ds-brand-text)}a:hover{color:var(--ds-brand)}
body{background:var(--ds-bg);max-width:1120px;margin:0 auto;padding:22px 24px 26px}
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
<div><div style="background:var(--ds-neutral-bg);color:var(--ds-neutral-fg);border:1px solid var(--ds-neutral-line);border-radius:var(--ds-radius-lg);padding:12px"><div style="font:var(--ds-type-body-strong)">Стоянка</div><div class="mono" style="font-size:10px;color:inherit;opacity:.75;margin-top:4px">neutral-bg / -fg</div></div>
<div style="display:flex;align-items:center;gap:6px;margin-top:8px"><span style="width:10px;height:10px;border-radius:50%;background:var(--ds-neutral-solid)"></span><span style="font:var(--ds-type-caption);color:var(--ds-fg-muted)">neutral-solid</span></div></div><div><div style="background:var(--ds-info-bg);color:var(--ds-info-fg);border:1px solid var(--ds-info-line);border-radius:var(--ds-radius-lg);padding:12px"><div style="font:var(--ds-type-body-strong)">Некорректные данные</div><div class="mono" style="font-size:10px;color:inherit;opacity:.75;margin-top:4px">info-bg / -fg</div></div>
<div style="display:flex;align-items:center;gap:6px;margin-top:8px"><span style="width:10px;height:10px;border-radius:50%;background:var(--ds-info-solid)"></span><span style="font:var(--ds-type-caption);color:var(--ds-fg-muted)">info-solid</span></div></div><div><div style="background:var(--ds-success-bg);color:var(--ds-success-fg);border:1px solid var(--ds-success-line);border-radius:var(--ds-radius-lg);padding:12px"><div style="font:var(--ds-type-body-strong)">Движение</div><div class="mono" style="font-size:10px;color:inherit;opacity:.75;margin-top:4px">success-bg / -fg</div></div>
<div style="display:flex;align-items:center;gap:6px;margin-top:8px"><span style="width:10px;height:10px;border-radius:50%;background:var(--ds-success-solid)"></span><span style="font:var(--ds-type-caption);color:var(--ds-fg-muted)">success-solid</span></div></div><div><div style="background:var(--ds-warning-bg);color:var(--ds-warning-fg);border:1px solid var(--ds-warning-line);border-radius:var(--ds-radius-lg);padding:12px"><div style="font:var(--ds-type-body-strong)">Тревога</div><div class="mono" style="font-size:10px;color:inherit;opacity:.75;margin-top:4px">warning-bg / -fg</div></div>
<div style="display:flex;align-items:center;gap:6px;margin-top:8px"><span style="width:10px;height:10px;border-radius:50%;background:var(--ds-warning-solid)"></span><span style="font:var(--ds-type-caption);color:var(--ds-fg-muted)">warning-solid</span></div></div><div><div style="background:var(--ds-danger-bg);color:var(--ds-danger-fg);border:1px solid var(--ds-danger-line);border-radius:var(--ds-radius-lg);padding:12px"><div style="font:var(--ds-type-body-strong)">Нет связи</div><div class="mono" style="font-size:10px;color:inherit;opacity:.75;margin-top:4px">danger-bg / -fg</div></div>
<div style="display:flex;align-items:center;gap:6px;margin-top:8px"><span style="width:10px;height:10px;border-radius:50%;background:var(--ds-danger-solid)"></span><span style="font:var(--ds-type-caption);color:var(--ds-fg-muted)">danger-solid</span></div></div>
</div>
<div data-ds-appearance="dark" style="margin-top:16px;background:var(--ds-bg);border-radius:var(--ds-radius-lg);padding:12px;display:flex;gap:8px;align-items:center">
<span class="eb" style="color:var(--ds-fg-subtle)">dark</span>
<span style="font:var(--ds-type-caption);background:var(--ds-neutral-bg);color:var(--ds-neutral-fg);border:1px solid var(--ds-neutral-line);border-radius:var(--ds-radius-pill);padding:4px 12px">Стоянка</span><span style="font:var(--ds-type-caption);background:var(--ds-info-bg);color:var(--ds-info-fg);border:1px solid var(--ds-info-line);border-radius:var(--ds-radius-pill);padding:4px 12px">Некорректные данные</span><span style="font:var(--ds-type-caption);background:var(--ds-success-bg);color:var(--ds-success-fg);border:1px solid var(--ds-success-line);border-radius:var(--ds-radius-pill);padding:4px 12px">Движение</span><span style="font:var(--ds-type-caption);background:var(--ds-warning-bg);color:var(--ds-warning-fg);border:1px solid var(--ds-warning-line);border-radius:var(--ds-radius-pill);padding:4px 12px">Тревога</span><span style="font:var(--ds-type-caption);background:var(--ds-danger-bg);color:var(--ds-danger-fg);border:1px solid var(--ds-danger-line);border-radius:var(--ds-radius-pill);padding:4px 12px">Нет связи</span>
</div></body></html>
